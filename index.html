<!DOCTYPE html>
<!-- Mis Finanzas — versión Firebase (adaptada 2026-11-24).
     Antes usaba Apps Script (URL + clave secreta); ahora usa Firebase
     Auth (inicio de sesión con Google) y Firestore del proyecto
     mis-finanzas-c3877. La interfaz y el resto del código no cambiaron. -->
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#F6F5FA">
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#121019">
<title>Mis Finanzas</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Finanzas">
<style>
:root{
  --fs:1;
  --bg:#F6F5FA; --card:#FFFFFF; --ink:#1B1830; --muted:#6E6A85; --line:#E7E4F0;
  --acc:#6D28D9; --acc-soft:#EEE7FD; --acc-ink:#FFFFFF;
  --gas:#D92D4B; --gas-soft:#FDE8EC; --ing:#0F9D6B; --ing-soft:#E2F6EE; --tra:#2563EB; --tra-soft:#E5EDFE;
  --shadow:0 1px 2px rgba(27,24,48,.06),0 4px 16px rgba(27,24,48,.05);
  --pop:#FFFFFF; --pop-line:#C9BDF0; --pop-shadow:0 14px 40px rgba(27,24,48,.22),0 2px 8px rgba(27,24,48,.12);
  --r:16px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#121019; --card:#1C1926; --ink:#F1EFF8; --muted:#A39FB8; --line:#2E2A3C;
    --acc:#A78BFA; --acc-soft:#2B2343; --acc-ink:#140F22;
    --gas:#FB7185; --gas-soft:#3A1E27; --ing:#34D399; --ing-soft:#173229; --tra:#60A5FA; --tra-soft:#1B2740;
    --shadow:none;
    --pop:#2C2740; --pop-line:#5B4D8A; --pop-shadow:0 16px 44px rgba(0,0,0,.65),0 2px 10px rgba(0,0,0,.5);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:calc(15px*var(--fs))/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.app{max-width:760px;margin:0 auto;min-height:100vh;padding-bottom:96px}
header.top{position:sticky;top:0;z-index:20;background:var(--bg);padding:calc(env(safe-area-inset-top) + 10px) 16px 8px;display:flex;align-items:center;gap:8px}
header.top h1{font-size:calc(20px*var(--fs));margin:0;flex:1;font-weight:700;letter-spacing:-.01em}
.icon-btn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn:active{background:var(--acc-soft)}
svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
main{padding:0 16px}
.view{display:none}.view.on{display:block}
.card{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);padding:16px;margin-bottom:12px}
.card h2{font-size:calc(13px*var(--fs));font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:0 0 10px}
.muted{color:var(--muted)}.small{font-size:calc(13px*var(--fs))}
.num{font-variant-numeric:tabular-nums}
.gas{color:var(--gas)}.ing{color:var(--ing)}.tra{color:var(--tra)}

/* month switcher */
.month{display:flex;align-items:center;justify-content:space-between;background:var(--card);border-radius:14px;box-shadow:var(--shadow);padding:4px;margin-bottom:12px}
.month b{font-size:calc(16px*var(--fs))}
/* hero */
.hero{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.hero .big{grid-column:1/-1}
.stat small{display:block;color:var(--muted);font-size:calc(12px*var(--fs));margin-bottom:2px}
.stat b{font-size:calc(20px*var(--fs));font-weight:700}
.stat.big b{font-size:calc(30px*var(--fs));letter-spacing:-.02em}
.delta{font-size:calc(12px*var(--fs));margin-top:2px}
/* bars */
.bar-row{display:grid;grid-template-columns:minmax(90px,1.1fr) 2fr auto;gap:10px;align-items:center;padding:7px 0;font-size:calc(14px*var(--fs))}
.bar-row.click{cursor:pointer}
.bar-track{height:8px;background:var(--line);border-radius:6px;overflow:hidden}
.bar-fill{height:100%;border-radius:6px}
.bar-row .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sub-rows{padding-left:14px;border-left:2px solid var(--line);margin:2px 0 6px 4px}
.sub-rows .bar-row{font-size:calc(13px*var(--fs));padding:4px 0}
/* columns chart */
.cols{display:flex;align-items:flex-end;gap:8px;height:150px;padding-top:6px}
.col{flex:1;display:flex;flex-direction:column;align-items:center;gap:4px;height:100%;justify-content:flex-end;min-width:0}
.col .pair{display:flex;gap:3px;align-items:flex-end;height:100%;width:100%;justify-content:center}
.col .pair i{display:block;width:42%;max-width:18px;border-radius:5px 5px 2px 2px;min-height:2px}
.col span{font-size:calc(11px*var(--fs));color:var(--muted)}
.legend{display:flex;gap:14px;font-size:calc(12px*var(--fs));color:var(--muted);margin-top:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* list */
.day{display:flex;justify-content:space-between;font-size:calc(12px*var(--fs));color:var(--muted);font-weight:600;padding:14px 4px 6px}
.items{background:var(--card);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden}
.item{display:flex;align-items:center;gap:12px;padding:12px 14px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.item:last-child{border-bottom:0}
.item:active{background:var(--acc-soft)}
.av{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;font-weight:700;font-size:calc(14px*var(--fs));flex:none}
.item .mid{flex:1;min-width:0}
.item .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .t2{font-size:calc(13px*var(--fs));color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .amt{font-weight:700;white-space:nowrap}
.pend{font-size:calc(11px*var(--fs));color:var(--tra);margin-left:6px}
.empty{text-align:center;color:var(--muted);padding:30px 10px}
/* chips */
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;padding:8px 13px;border-radius:999px;background:var(--card);border:1px solid var(--line);font-size:calc(14px*var(--fs));white-space:nowrap}
.chip.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);font-weight:600}
.chip.add{border-style:dashed;color:var(--muted)}
.search{display:flex;align-items:center;gap:8px;background:var(--card);border-radius:12px;padding:0 12px;box-shadow:var(--shadow);margin-bottom:10px}
.search input{border:0;background:none;outline:none;flex:1;height:44px}
.filter-tag{display:inline-flex;align-items:center;gap:6px;background:var(--acc-soft);color:var(--acc);border-radius:999px;padding:6px 10px;font-size:calc(13px*var(--fs));font-weight:600;margin:0 6px 8px 0}
/* accounts */
.acc-row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line);cursor:pointer;width:100%;text-align:left}
.acc-row:last-child{border-bottom:0}
.acc-row .mid{flex:1}
.acc-row.zero{opacity:.5}
/* bottom nav */
nav.bottom{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px);display:flex;justify-content:space-around;align-items:center}
nav.bottom button{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:calc(11px*var(--fs));color:var(--muted);padding:4px 6px;min-width:62px;opacity:.8}
nav.bottom button{transition:color .25s,opacity .25s}
nav.bottom button .ni{position:relative;display:grid;place-items:center;width:58px;height:30px;border-radius:999px}
nav.bottom button .ni::before{content:'';position:absolute;inset:0;border-radius:999px;background:var(--acc-soft);background:color-mix(in srgb,var(--acc) 24%,transparent);transform:scaleX(.35);opacity:0;transition:transform .32s cubic-bezier(.2,.9,.25,1.15),opacity .2s}
nav.bottom button .ni svg{position:relative;z-index:1}
nav.bottom button.on{color:var(--acc);font-weight:700;opacity:1}
nav.bottom button.on .ni::before{transform:scaleX(1);opacity:1}
nav.bottom button.on svg{stroke-width:2.4;animation:navpop .38s ease-out}
nav.bottom button:active .ni{transform:scale(.92)}
nav.bottom .fab{transition:transform .15s}
nav.bottom .fab:active{transform:scale(.92)}
@keyframes navpop{0%{transform:scale(.8)}55%{transform:scale(1.15)}100%{transform:scale(1)}}
.view.on{animation:vista .32s ease-out}
@keyframes vista{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion: reduce){nav.bottom button .ni::before,nav.bottom button.on svg,.view.on{transition:none;animation:none}}
nav.bottom .fab{width:56px;height:56px;border-radius:18px;background:var(--acc);color:var(--acc-ink);display:grid;place-items:center;margin-top:-26px;box-shadow:0 6px 18px rgba(109,40,217,.35);min-width:0;padding:0}
nav.bottom .fab svg{width:28px;height:28px;stroke-width:2.4}
/* sheet (form) */
.sheet{position:fixed;top:0;left:0;right:0;height:100vh;height:100dvh;z-index:50;background:var(--bg);display:none;flex-direction:column}
.sheet.on{display:flex;animation:subir .32s cubic-bezier(.2,.8,.2,1)}.sheet.saliendo{display:flex;animation:bajar .24s ease-in forwards;pointer-events:none}@keyframes subir{from{transform:translateY(100%)}to{transform:none}}@keyframes bajar{from{transform:none}to{transform:translateY(100%)}}@media (prefers-reduced-motion: reduce){.sheet.on,.sheet.saliendo{animation:none}.sheet.saliendo{display:none}}
.sheet header{display:flex;align-items:center;gap:8px;padding:calc(env(safe-area-inset-top) + 8px) 12px 8px;border-bottom:1px solid var(--line);background:var(--card)}
.sheet header h3{flex:1;margin:0;font-size:calc(17px*var(--fs))}
.sheet .body{flex:1;overflow-y:auto;padding:14px 16px 20px;max-width:760px;width:100%;margin:0 auto}
.sheet footer{padding:10px 16px calc(env(safe-area-inset-bottom) + 10px);background:var(--card);border-top:1px solid var(--line);display:flex;gap:10px;max-width:760px;width:100%;margin:0 auto}
.seg{display:grid;grid-template-columns:repeat(3,1fr);background:var(--card);border-radius:14px;padding:4px;gap:4px;box-shadow:var(--shadow)}
.seg button{height:40px;border-radius:10px;font-weight:600;color:var(--muted)}
.seg button.on[data-t=Gasto]{background:var(--gas-soft);color:var(--gas)}
.seg button.on[data-t=Ingreso]{background:var(--ing-soft);color:var(--ing)}
.seg button.on[data-t=Transferencia]{background:var(--tra-soft);color:var(--tra)}
.amount{display:flex;align-items:center;justify-content:center;gap:4px;margin:18px 0 6px}
.amount span{font-size:calc(30px*var(--fs));color:var(--muted);font-weight:600}
.amount input,.amount .imp{font-size:calc(44px*var(--fs));font-weight:700;border:0;background:none;outline:none;width:100%;max-width:230px;text-align:left;letter-spacing:-.02em;white-space:nowrap;overflow:hidden;line-height:1.25;cursor:text}
.ce:empty::before{content:attr(data-ph);color:var(--muted);opacity:.75;pointer-events:none}
.field.ce:not(.nota){line-height:44px;white-space:nowrap;overflow:hidden;cursor:text}
.search .ce{flex:1;height:44px;line-height:44px;white-space:nowrap;overflow:hidden;outline:none;cursor:text}
.pre-row .ce{width:120px;flex:none;text-align:right}
.field.nota{height:auto;min-height:70px;padding:10px 12px;white-space:pre-wrap;overflow-wrap:anywhere;cursor:text;line-height:1.4}
.lbl{font-size:calc(12px*var(--fs));font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;margin:14px 0 8px}
.field{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;outline:none}
.field:focus{border-color:var(--acc)}
/* desplegable propio (reemplaza al <select> del navegador, cuya lista
   la dibuja el navegador y no se puede estilizar) */
.dd{position:relative}
.dd-btn{width:100%;height:46px;border:1px solid var(--line);border-radius:12px;background:var(--card);padding:0 12px;display:flex;align-items:center;justify-content:space-between;gap:8px;text-align:left}
.dd-btn:focus{border-color:var(--acc)}
.dd-btn .dd-val{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-btn svg{width:18px;height:18px;color:var(--muted);flex:none;transition:transform .2s}
.dd.open .dd-btn svg{transform:rotate(180deg)}
.dd-panel{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--pop);border:1.5px solid var(--pop-line);border-radius:12px;box-shadow:var(--pop-shadow);z-index:80;display:none;max-height:260px;overflow-y:auto}
.dd.open .dd-panel{display:block;animation:ddin .16s ease-out}
.dd.open .dd-btn{border-color:var(--acc)}
@keyframes ddin{from{opacity:0;transform:translateY(-4px)}to{opacity:1;transform:none}}
.dd-opt{display:flex;align-items:center;justify-content:space-between;gap:8px;width:100%;text-align:left;padding:12px 14px;border-bottom:1px solid color-mix(in srgb,var(--pop-line) 45%,transparent)}
.dd-opt:last-child{border-bottom:0}
.dd-opt:active{background:var(--acc-soft)}
.dd-opt.on{color:var(--acc);font-weight:700;background:var(--acc-soft)}
.dd-opt .tick{color:var(--acc);font-weight:700}

textarea.field{height:70px;padding:10px 12px;resize:none}
.row2{display:flex;gap:8px;align-items:center}
.btn{height:48px;border-radius:14px;padding:0 18px;font-weight:700;flex:1}
.btn.pri{background:var(--acc);color:var(--acc-ink)}
.btn.sec{background:var(--acc-soft);color:var(--acc)}
.btn.dan{background:var(--gas-soft);color:var(--gas);flex:none}
.btn:disabled{opacity:.5}
.inline-new{display:flex;gap:8px;margin-top:4px}
.inline-new input{flex:1}
/* toast & loader */
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:calc(14px*var(--fs));opacity:0;transition:.25s;z-index:60;pointer-events:none;max-width:90%}
.toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
/* ventana de confirmación propia (reemplaza al confirm() del navegador) */
.confirm-veil{position:fixed;inset:0;z-index:90;background:rgba(10,8,20,.62);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:24px}
.confirm-veil.on{display:flex}
.confirm-card{background:var(--pop);border:1.5px solid var(--pop-line);border-radius:var(--r);box-shadow:var(--pop-shadow);padding:22px 20px 20px;max-width:420px;width:100%;animation:cfin .18s ease-out}
@keyframes cfin{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:none}}
.confirm-msg{font-size:calc(17px*var(--fs));font-weight:600;line-height:1.35;margin-bottom:20px}
.confirm-btns .btn.dan{background:#DC2645;color:#fff}
.confirm-btns{display:flex;gap:10px}
.confirm-btns .btn{flex:1}

.sync{height:3px;position:fixed;top:0;left:0;right:0;z-index:70;background:linear-gradient(90deg,transparent,var(--acc),transparent);background-size:50% 100%;animation:sl 1s linear infinite;display:none}
.sync.on{display:block}
@keyframes sl{from{background-position:-50% 0}to{background-position:150% 0}}
.loading{display:grid;place-items:center;height:60vh;color:var(--muted)}
.set-group{margin-bottom:6px}
#vozVeil.on{display:flex}
.voz-card{text-align:center}
.voz-mic{width:72px;height:72px;border-radius:50%;margin:4px auto 14px;display:grid;place-items:center;background:var(--acc);color:var(--acc-ink);animation:vozpulso 1.4s ease-in-out infinite}
.voz-mic svg{width:34px;height:34px;stroke-width:2.2}
@keyframes vozpulso{0%,100%{box-shadow:0 0 0 0 color-mix(in srgb,var(--acc) 55%,transparent)}50%{box-shadow:0 0 0 16px color-mix(in srgb,var(--acc) 0%,transparent)}}
.confirm-veil.error .voz-mic{animation:none;background:var(--gas)}
#vozEstado.gas{font-size:calc(15px*var(--fs));font-weight:600}
.voz-txt{min-height:24px;font-size:calc(16px*var(--fs));color:var(--ink);font-style:italic}
.voz-banner{display:flex;gap:8px;align-items:flex-start;background:var(--acc-soft);color:var(--acc);border-radius:12px;padding:10px 12px;margin-bottom:12px;font-size:calc(14px*var(--fs))}
.voz-banner svg{width:18px;height:18px;flex:none;margin-top:1px}
body.compacta .card{padding:12px 14px;margin-bottom:9px}
body.compacta .month{margin-bottom:9px}
body.compacta .hero{gap:6px}
body.compacta .item{padding:8px 12px}
body.compacta .acc-row{padding:8px 0}
body.compacta .al-row{padding:7px 0}
body.compacta .set-item{padding:7px 0}
body.compacta .bar-row{padding:4px 0}
body.compacta .bud{padding:5px 0}
body.compacta .day{padding:10px 4px 4px}
body.compacta .av{width:32px;height:32px;border-radius:10px}
body.compacta .card h2{margin-bottom:6px}
body.compacta details.cat-block summary{padding:7px 0}
.ub{flex-basis:100%;margin-top:4px}
.ub-top{display:flex;align-items:center;gap:10px}
.ub-top .bar-track{flex:1;height:8px}
.ub-top span{font-size:calc(13px*var(--fs));font-weight:600;min-width:38px;text-align:right}
.ub-bot{display:flex;justify-content:space-between;font-size:calc(13px*var(--fs));color:var(--muted);margin-top:4px}
.acc-row.cc{flex-wrap:wrap;row-gap:0}
.sw{position:relative;width:44px;height:26px;flex:none;display:inline-block}
.sw input{opacity:0;width:0;height:0;position:absolute}
.sw span{position:absolute;inset:0;background:var(--line);border-radius:999px;transition:.2s}
.sw span::after{content:'';position:absolute;width:20px;height:20px;left:3px;top:3px;border-radius:50%;background:#fff;transition:.2s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.sw input:checked+span{background:var(--acc)}
.sw input:checked+span::after{transform:translateX(18px)}
svg.chart{width:100%;height:auto;stroke:none;fill:none;display:block;margin:4px 0}
.col .stack{display:flex;flex-direction:column-reverse;width:60%;max-width:26px;border-radius:5px 5px 2px 2px;overflow:hidden;min-height:2px}
.col .stack i{display:block;min-height:1px}
.tsel{display:inline-flex;align-items:center;gap:6px;font:inherit;color:inherit;padding:2px 0}.tsel svg{color:var(--acc);margin-top:2px;transition:transform .16s}.tsel.open svg{transform:rotate(180deg)}.rep-veil{position:fixed;inset:0;z-index:85;background:rgba(10,8,20,.45)}.rep-menu{position:fixed;left:16px;width:min(62%,260px);background:var(--pop);border:1.5px solid var(--pop-line);border-radius:14px;box-shadow:var(--pop-shadow);padding:6px;z-index:86;animation:ddin .16s ease-out}.rep-menu button{display:block;width:100%;text-align:left;padding:13px 14px;border-radius:10px;font-size:calc(15px*var(--fs))}.rep-menu button.on{background:var(--acc);color:var(--acc-ink);font-weight:600}.chips.per{flex-wrap:wrap;gap:6px;overflow:visible}.chips.per .chip{padding:8px 11px}.rep-anim{animation:vista .32s ease-out}@media (prefers-reduced-motion: reduce){.rep-anim,.rep-menu{animation:none}}
.bud{padding:8px 0;cursor:pointer}
.bud-top{display:flex;justify-content:space-between;gap:10px;font-size:calc(14px*var(--fs));margin-bottom:5px}
.bud .bar-track{position:relative;height:10px;overflow:visible}
.bud .bar-fill{position:absolute;left:0;top:0}
.pace{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--ink);opacity:.35;border-radius:2px}
.bud-sub{font-size:calc(12px*var(--fs));color:var(--muted);margin-top:4px}
.warn{color:#B45309}
@media (prefers-color-scheme: dark){.warn{color:#FBBF24}}
.al-row{display:flex;align-items:center;gap:12px;padding:11px 0;border-bottom:1px solid var(--line)}
.al-row:last-child{border-bottom:0}
.al-row .mid{flex:1;min-width:0}
.al-row .t1{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.al-row .t2{font-size:calc(12px*var(--fs));color:var(--muted)}
.al-row .right{text-align:right;flex:none}
.al-btns{display:flex;gap:4px;justify-content:flex-end;margin-top:2px}

<script type="module">
/* ============ Firebase ============ */
import { initializeApp } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-auth.js";
import { initializeFirestore, persistentLocalCache, persistentMultipleTabManager, collection, doc, getDoc, getDocs, setDoc, updateDoc, deleteDoc, query, where, limit, writeBatch, onSnapshot } from "https://www.gstatic.com/firebasejs/12.11.0/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyA0CeKBk90eGaUd9i14MvaapnKFKzveViw",
  authDomain: "mis-finanzas-c3877.firebaseapp.com",
  projectId: "mis-finanzas-c3877",
  storageBucket: "mis-finanzas-c3877.firebasestorage.app",

  appId: "1:727957620020:web:e5754edf176eb4422a1161"
};
const FB_APP = initializeApp(firebaseConfig);
const FB_AUTH = getAuth(FB_APP);
// Copia local en el dispositivo: la app lee y guarda primero aquí y sincroniza sola con la nube
const FB_DB = initializeFirestore(FB_APP,{localCache:persistentLocalCache({tabManager:persistentMultipleTabManager()})});
const FB_PROVIDER = new GoogleAuthProvider();
// Promesa que se resuelve con el usuario (o null) cuando Firebase ya sabe
// si hay sesión iniciada. Sirve para no preguntar antes de tiempo.
const FB_READY = new Promise((res)=>{ const off = onAuthStateChanged(FB_AUTH, (u)=>{ off(); res(u); }); });
/* Cada cuenta tiene su propia carpeta: usuarios/{uid}/movimientos, categorias, ... */
const uc=(nombre)=>collection(FB_DB,'usuarios',FB_AUTH.currentUser.uid,nombre);
const ud=(nombre,id)=>doc(FB_DB,'usuarios',FB_AUTH.currentUser.uid,nombre,String(id));
async function fbEntrar(){ await signInWithPopup(FB_AUTH, FB_PROVIDER); }
async function fbSalir(){ fbDetenerEscucha(); await signOut(FB_AUTH); try{localStorage.removeItem('misfinanzas_cache_v1');localStorage.removeItem('misfinanzas_cola_v1')}catch(e){} D={mov:[],cat:[],sub:[],met:[],pre:[],rec:[],tar:[],hoy:''}; }

/* ============ estado ============ */
let D = {mov:[],cat:[],sub:[],met:[],pre:[],rec:[],tar:[],hoy:''};
function normalizar(){['mov','cat','sub','met','pre','rec','tar'].forEach(k=>{if(!Array.isArray(D[k]))D[k]=[]});if(!D.cfg||typeof D.cfg!=='object')D.cfg={}}
const S = {view:'inicio', mes:'', q:'', tipo:'', acc:'', cat:'', sub:'', rep:'mes', repOpen:{}, form:null, scroll:{}, despues:null};
const CACHE_KEY='misfinanzas_cache_v1', QUEUE_KEY='misfinanzas_cola_v1';
const MESES=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
const PALETA=['#6D28D9','#DB2777','#EA580C','#CA8A04','#16A34A','#0891B2','#2563EB','#9333EA','#DC2626','#0D9488','#65A30D','#C026D3'];

const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const fmt=n=>(n<0?'-':'')+'$'+Math.abs(n).toLocaleString('es-MX',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmt0=n=>(n<0?'-':'')+'$'+Math.abs(Math.round(n)).toLocaleString('es-MX');
const store={get(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
function hoyLocal(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function addDays(f,n){const p=f.split('-').map(Number);const d=new Date(p[0],p[1]-1,p[2]+n);return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function mesNombre(ym){const [y,m]=ym.split('-');return MESES[+m-1]+' '+y}
function mesCorto(ym){return MESES[+ym.slice(5)-1].slice(0,3)}
function mesAdd(ym,n){let [y,m]=ym.split('-').map(Number);m+=n;while(m<1){m+=12;y--}while(m>12){m-=12;y++}return y+'-'+String(m).padStart(2,'0')}
function color(name){let h=0;for(const c of String(name))h=(h*31+c.charCodeAt(0))>>>0;return PALETA[h%PALETA.length]}
function iniciales(s){return String(s||'?').split(/\s+/).filter(Boolean).slice(0,2).map(w=>w[0]).join('').toUpperCase()}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove('on'),2400)}
/* Confirmación propia: muestra la ventana de la app y resuelve true/false
   según el botón tocado. Reemplaza al confirm() del navegador. */
function confirmar(msg, si, clase){
  return new Promise(res=>{
    const veil=$('#confirmVeil');
    $('#confirmMsg').textContent=msg;
    const bSi=$('#confirmSi'); bSi.textContent=si||'Sí, borrar'; bSi.className='btn '+(clase||'dan');
    const bNo=$('#confirmNo');
    const cerrar=v=>{ veil.classList.remove('on'); bSi.onclick=bNo.onclick=veil.onclick=null; res(v); };
    bSi.onclick=()=>cerrar(true);
    bNo.onclick=()=>cerrar(false);
    veil.onclick=e=>{ if(e.target===veil) cerrar(false); };
    veil.classList.add('on');
  });
}

function syncing(on){$('#sync').classList.toggle('on',!!on)}
/* Desplegable propio: ddHTML dibuja el botón + la lista, bindDD conecta
   la elección con onPick. La lista es HTML de la app, no la del navegador. */
function ddHTML(id, opciones, sel){
  const cur=opciones.find(o=>o[0]===sel)||opciones[0]||['',''];
  return `<div class="dd" id="dd-${id}"><button type="button" class="dd-btn"><span class="dd-val">${esc(cur[1])}</span><svg viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg></button><div class="dd-panel">${opciones.map(([v,l])=>`<button type="button" class="dd-opt ${v===sel?'on':''}" data-v="${esc(v)}"><span>${esc(l)}</span>${v===sel?'<span class="tick">✓</span>':''}</button>`).join('')}</div></div>`;
}
function bindDD(scope, id, onPick){
  const root=scope.querySelector('#dd-'+id); if(!root) return;
  const btn=root.querySelector('.dd-btn');
  btn.onclick=e=>{ e.stopPropagation(); const was=root.classList.contains('open'); document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')); if(!was) root.classList.add('open'); };
  root.querySelectorAll('.dd-opt').forEach(b=>b.onclick=e=>{ e.stopPropagation();
    root.querySelector('.dd-val').textContent=b.querySelector('span').textContent;
    root.querySelectorAll('.dd-opt').forEach(x=>{ x.classList.remove('on'); const t=x.querySelector('.tick'); if(t) t.remove(); });
    b.classList.add('on'); b.insertAdjacentHTML('beforeend','<span class="tick">✓</span>');
    root.classList.remove('open'); onPick(b.dataset.v); });
}
document.addEventListener('click',()=>{ document.querySelectorAll('.dd.open').forEach(d=>d.classList.remove('open')) });


/* ============ apariencia (se guarda en este dispositivo) ============ */
const AP_KEY='misfinanzas_apariencia_v1';
const LETRAS={peq:['Pequeña',0.92],normal:['Predeterminada',1],grande:['Grande',1.12]};
const DENS={normal:'Predeterminada',compacta:'Compacta'};
let AP=Object.assign({letra:'normal',dens:'normal'},store.get(AP_KEY)||{});
function aplicarApariencia(){ document.documentElement.style.setProperty('--fs',(LETRAS[AP.letra]||LETRAS.normal)[1]); document.body.classList.toggle('compacta',AP.dens==='compacta') }
aplicarApariencia();
/* ============ conexión ============ */
/* Ya no hay URL ni clave de Apps Script: la conexión es tu cuenta de
   Google (Firebase Auth). Ver "API (Firebase / Firestore)" más abajo. */
/* ============ API (Firebase / Firestore) ============ */
/* La app sigue llamando a api('getData'), api('guardarMovimiento', ...),
   etc. igual que antes; solo cambia por dentro: ahora lee y escribe en
   las colecciones de Firestore del proyecto mis-finanzas.
   Colecciones: movimientos, categorias, subcategorias, metodos,
   presupuestos, recurrentes, tarjetas y config/app. */
const FB_COLS={cat:'categorias',sub:'subcategorias',met:'metodos',pre:'presupuestos',rec:'recurrentes',tar:'tarjetas'};
// Movimiento: claves cortas de la app <-> campos de Firestore
const MOV_A_FB=m=>({id:m.id,fecha:m.f,tipo:m.t,categoria:m.c,subcategoria:m.s||'',metodo_origen:m.o,metodo_destino:m.d||'',importe:Number(m.m),nota:(m.n||'').trim()});
const MOV_DE_FB=d=>{const x=d.data();return {id:d.id,f:x.fecha,t:x.tipo,c:x.categoria,s:x.subcategoria||'',o:x.metodo_origen,d:x.metodo_destino||'',m:x.importe,n:x.nota||''}};
const CAT_DE_FB={
  cat:d=>{const x=d.data();return {id:d.id,nombre:x.nombre,tipo:x.tipo}},
  sub:d=>{const x=d.data();return {id:d.id,nombre:x.nombre,cat:x.categoria}},
  met:d=>{const x=d.data();return {id:d.id,nombre:x.nombre,tipo:x.tipo,inicial:x.inicial}},
  pre:d=>{const x=d.data();return {id:d.id,cat:x.categoria,monto:x.monto}},
  rec:d=>{const x=d.data();return {id:d.id,nombre:x.nombre,t:x.tipo,c:x.categoria,s:x.subcategoria||'',o:x.metodo_origen,d:x.metodo_destino||'',m:x.importe,n:x.nota||'',frec:x.frecuencia,dia:x.dia,prox:x.proxima,activo:x.activo}},
  tar:d=>{const x=d.data();return {id:d.id,met:x.metodo,corte:x.diaCorte,pago:x.diaPago,limite:x.limite,alerta:x.alertaPct}}
};
const CAT_A_FB={
  cat:p=>({nombre:p.nombre,tipo:p.tipo}),
  sub:p=>({nombre:p.nombre,categoria:p.cat}),
  met:p=>({nombre:p.nombre,tipo:p.tipo,inicial:Number(p.inicial)||0}),
  tar:p=>({metodo:p.met,diaCorte:Number(p.corte)||0,diaPago:Number(p.pago)||0,limite:Number(p.limite)||0,alertaPct:Number(p.alerta)||0}),
  rec:r=>({nombre:r.nombre,tipo:r.t,categoria:r.c,subcategoria:r.s||'',metodo_origen:r.o,metodo_destino:r.d||'',importe:Number(r.m),nota:r.n||'',frecuencia:r.frec,dia:r.dia,proxima:r.prox,activo:!!r.activo})
};

async function fbGetData(){
  const [mov,cat,sub,met,pre,rec,tar,cfgSnap]=await Promise.all([
    getDocs(uc('movimientos')),
    getDocs(uc('categorias')),
    getDocs(uc('subcategorias')),
    getDocs(uc('metodos')),
    getDocs(uc('presupuestos')),
    getDocs(uc('recurrentes')),
    getDocs(uc('tarjetas')),
    getDoc(ud('config','app'))
  ]);
  return {
    mov:mov.docs.map(MOV_DE_FB).sort((a,b)=>a.f.localeCompare(b.f)),
    cat:cat.docs.map(CAT_DE_FB.cat),
    sub:sub.docs.map(CAT_DE_FB.sub),
    met:met.docs.map(CAT_DE_FB.met),
    pre:pre.docs.map(CAT_DE_FB.pre),
    rec:rec.docs.map(CAT_DE_FB.rec),
    tar:tar.docs.map(CAT_DE_FB.tar),
    cfg:cfgSnap.exists()?cfgSnap.data():{},
    hoy:hoyLocal()
  };
}

/* ============ primera vez de cada cuenta ============ */
const FB_TODAS=['movimientos','categorias','subcategorias','metodos','presupuestos','recurrentes','tarjetas'];
const INICIALES={
  categorias:[['Apoyo familiar','Ingreso'],['Beca','Ingreso'],['Regalo','Ingreso'],['Otros ingresos','Ingreso'],['Transferencia','Transferencia'],
    ['Comida','Gasto'],['Transporte','Gasto'],['Escuela','Gasto'],['Casa','Gasto'],['Celular e internet','Gasto'],['Salud','Gasto'],['Ropa y cuidado personal','Gasto'],['Salidas y entretenimiento','Gasto'],['Otros','Gasto']],
  subcategorias:{'Comida':['Comedor o cafetería','Comida en la calle','Despensa'],'Transporte':['Camión o metro','Taxi, Didi o Uber','Gasolina'],
    'Escuela':['Libros','Copias e impresiones','Material','Inscripción o colegiatura'],'Casa':['Renta','Servicios'],'Celular e internet':['Plan del celular','Suscripciones'],
    'Salud':['Medicinas','Consultas'],'Apoyo familiar':['Mesada']},
  metodos:[['NU','Débito'],['TDC NU','Crédito'],['Mercado Pago','Débito'],['Efectivo','Efectivo']]
};
async function prepararCarpeta(){
  const marca='misfinanzas_carpeta_'+FB_AUTH.currentUser.uid;
  if(store.get(marca)) return;
  await prepararCarpetaNube();
  store.set(marca,true);
}
async function prepararCarpetaNube(){
  const cfgRef=ud('config','app');
  const cfg=await getDoc(cfgRef);
  if(cfg.exists()&&cfg.data().creado) return;                       // ya preparada
  const propios=await getDocs(query(uc('movimientos'),limit(1)));
  if(!propios.empty){ await setDoc(cfgRef,{creado:hoyLocal()},{merge:true}); return }
  // ¿hay datos anteriores (de antes de separar por persona)? Solo la cuenta de Juan Carlos puede leerlos.
  let viejos=null;
  try{ viejos=await getDocs(collection(FB_DB,'movimientos')) }catch(e){ viejos=null }
  if(viejos&&!viejos.empty){
    const ok=await confirmar(`Encontré tus datos anteriores (${viejos.size.toLocaleString('es-MX')} movimientos). ¿Copiarlos a tu carpeta personal? Solo se hace una vez.`,'Copiar mis datos','pri');
    if(!ok) throw new Error('Copia cancelada. Vuelve a abrir la app para copiar tus datos.');
    await copiarDatosAnteriores();
  }else{
    await crearCarpetaNueva();
  }
}
async function escribirEnLotes(ops){ // ops: [{ref,data}]
  for(let i=0;i<ops.length;i+=400){
    const b=writeBatch(FB_DB); ops.slice(i,i+400).forEach(o=>b.set(o.ref,o.data)); await b.commit();
  }
}
async function copiarDatosAnteriores(){
  $('#loading').style.display=''; $('#loading').textContent='Copiando tus datos a tu carpeta personal…'; syncing(true);
  const cuenta={}, ops=[];
  let sumaVieja=0;
  for(const col of FB_TODAS){
    const snap=await getDocs(collection(FB_DB,col));
    cuenta[col]=snap.size;
    snap.docs.forEach(d=>{ const x=d.data(); if(col==='movimientos') sumaVieja+=Number(x.importe)||0; ops.push({ref:ud(col,d.id),data:{...x,id:d.id}}) });
  }
  const cfgVieja=await getDoc(doc(FB_DB,'config','app'));
  await escribirEnLotes(ops);
  await setDoc(ud('config','app'),{...(cfgVieja.exists()?cfgVieja.data():{}),creado:hoyLocal(),migradoDe:'datos anteriores'},{merge:true});
  // verificación: volver a contar lo copiado
  const dif=[]; let sumaNueva=0;
  for(const col of FB_TODAS){
    const snap=await getDocs(uc(col));
    if(col==='movimientos') snap.docs.forEach(d=>sumaNueva+=Number(d.data().importe)||0);
    if(snap.size!==cuenta[col]) dif.push(`${col}: ${cuenta[col]} → ${snap.size}`);
  }
  if(Math.abs(sumaNueva-sumaVieja)>0.005) dif.push(`suma de importes: ${fmt(sumaVieja)} → ${fmt(sumaNueva)}`);
  syncing(false);
  if(dif.length) await confirmar('⚠️ La copia no cuadra: '+dif.join('; ')+'. No borres nada y avísale a Claude.','Entendido','pri');
  else await confirmar(`✓ Copia verificada: ${cuenta.movimientos.toLocaleString('es-MX')} movimientos (suma ${fmt(sumaVieja)}), ${cuenta.categorias} categorías, ${cuenta.metodos} cuentas, ${cuenta.presupuestos} presupuestos, ${cuenta.recurrentes} recurrentes y ${cuenta.tarjetas} tarjetas.`,'Continuar','pri');
}

/* ============ escucha en vivo ============ */
/* Cuando algo cambia en Firestore (por ejemplo, un movimiento guardado
   en otro dispositivo), Firestore avisa solo y la app actualiza los
   datos y vuelve a dibujar, sin recargar la página. Antes, cada
   dispositivo solo leía los datos una vez al abrir la app. */
let FB_UNSUBS=null, FB_SRV=null, FB_LISTO={}, FB_SYNC_T=null;
function fbAplicarServidor(){
  if(!FB_SRV) return;
  const claves=['mov','cat','sub','met','pre','rec','tar','cfg'];
  if(!claves.every(k=>FB_LISTO[k])) return; // espera a tener todas las colecciones
  D={mov:FB_SRV.mov.map(x=>({...x})),cat:[...FB_SRV.cat],sub:[...FB_SRV.sub],met:[...FB_SRV.met],pre:[...FB_SRV.pre],rec:[...FB_SRV.rec],tar:[...FB_SRV.tar],cfg:{...FB_SRV.cfg},hoy:hoyLocal()};
  normalizar();
  store.set(CACHE_KEY,{mov:FB_SRV.mov,cat:FB_SRV.cat,sub:FB_SRV.sub,met:FB_SRV.met,pre:FB_SRV.pre,rec:FB_SRV.rec,tar:FB_SRV.tar,cfg:FB_SRV.cfg,hoy:D.hoy});
  aplicarCola();
  render();
}
function fbEscuchar(){
  if(FB_UNSUBS||!FB_AUTH.currentUser) return; // ya escucha, o sin sesión
  FB_SRV={mov:[],cat:[],sub:[],met:[],pre:[],rec:[],tar:[],cfg:{},hoy:hoyLocal()};
  FB_LISTO={};
  const tocar=()=>{ clearTimeout(FB_SYNC_T); FB_SYNC_T=setTimeout(fbAplicarServidor,150); };
  const subs=[];
  const escucharCol=(col,clave,conv,ordenar)=>{
    subs.push(onSnapshot(uc(col),snap=>{
      FB_SRV[clave]=snap.docs.map(conv);
      if(ordenar) FB_SRV[clave].sort((a,b)=>a.f.localeCompare(b.f));
      FB_LISTO[clave]=true; tocar();
    },()=>{ /* si la escucha falla, la app sigue con recarga manual */ }));
  };
  escucharCol('movimientos','mov',MOV_DE_FB,true);
  escucharCol('categorias','cat',CAT_DE_FB.cat);
  escucharCol('subcategorias','sub',CAT_DE_FB.sub);
  escucharCol('metodos','met',CAT_DE_FB.met);
  escucharCol('presupuestos','pre',CAT_DE_FB.pre);
  escucharCol('recurrentes','rec',CAT_DE_FB.rec);
  escucharCol('tarjetas','tar',CAT_DE_FB.tar);
  subs.push(onSnapshot(ud('config','app'),snap=>{
    FB_SRV.cfg=snap.exists()?snap.data():{};
    FB_LISTO.cfg=true; tocar();
  },()=>{}));
  FB_UNSUBS=subs;
}
function fbDetenerEscucha(){
  if(!FB_UNSUBS) return;
  FB_UNSUBS.forEach(u=>{ try{u()}catch(e){} });
  FB_UNSUBS=null; FB_SRV=null; FB_LISTO={};
}
/* Las escrituras quedan al instante en la copia local y se suben solas a la nube
   (aunque no haya señal o cierres la app). La rayita morada indica que aún hay algo por subir. */
let FB_PEND=0;
function enNube(promesa){
  FB_PEND++; syncing(true);
  promesa.catch(e=>toast('No se pudo guardar en la nube: '+(e.message||e)))
    .finally(()=>{ FB_PEND--; if(FB_PEND<=0){ FB_PEND=0; syncing(false) } });
}

// Al cambiar un nombre, actualizar los movimientos y catálogos que lo usan
// (antes lo hacía el motor de Apps Script).
async function fbRenombrar(tipo,viejo,nuevo){
  const cambios=[];
  if(tipo==='cat'){
    cambios.push(['movimientos','categoria',viejo.nombre,{categoria:nuevo.nombre}]);
    cambios.push(['presupuestos','categoria',viejo.nombre,{categoria:nuevo.nombre}]);
    cambios.push(['recurrentes','categoria',viejo.nombre,{categoria:nuevo.nombre}]);
    cambios.push(['subcategorias','categoria',viejo.nombre,{categoria:nuevo.nombre}]);
  }else if(tipo==='sub'){
    cambios.push(['movimientos','subcategoria',viejo.nombre,{subcategoria:nuevo.nombre,categoria:nuevo.cat},{campo:'categoria',valor:viejo.cat}]);
    cambios.push(['recurrentes','subcategoria',viejo.nombre,{subcategoria:nuevo.nombre,categoria:nuevo.cat},{campo:'categoria',valor:viejo.cat}]);
  }else if(tipo==='met'){
    cambios.push(['movimientos','metodo_origen',viejo.nombre,{metodo_origen:nuevo.nombre}]);
    cambios.push(['movimientos','metodo_destino',viejo.nombre,{metodo_destino:nuevo.nombre}]);
    cambios.push(['recurrentes','metodo_origen',viejo.nombre,{metodo_origen:nuevo.nombre}]);
    cambios.push(['recurrentes','metodo_destino',viejo.nombre,{metodo_destino:nuevo.nombre}]);
    cambios.push(['tarjetas','metodo',viejo.nombre,{metodo:nuevo.nombre}]);
  }
  const todos=[];
  for(const u of cambios){
    let q=query(uc(u[0]),where(u[1],'==',u[2]));
    if(u[4]) q=query(q,where(u[4].campo,'==',u[4].valor));
    const snap=await getDocs(q);
    snap.docs.forEach(d=>todos.push({ref:d.ref,set:u[3]}));
  }
  for(let i=0;i<todos.length;i+=450){
    const batch=writeBatch(FB_DB);
    todos.slice(i,i+450).forEach(t=>batch.update(t.ref,t.set));
    enNube(batch.commit());
  }
}
async function fbGuardarCatalogo(tipo,p){
  const col=FB_COLS[tipo];

async function api(fn,...args){
  if(window.MOCK_API) return new Promise((res,rej)=>setTimeout(()=>{try{res(window.MOCK_API(fn,args))}catch(e){rej(e)}},150));
  await FB_READY; // espera a saber si hay sesión
  if(!FB_AUTH.currentUser) throw new Error('Sesión no iniciada');
  switch(fn){
    case 'getData': return fbGetData();
    case 'guardarMovimiento': return fbGuardarMovimiento(args[0]);
    case 'borrarMovimiento': enNube(deleteDoc(ud('movimientos',args[0]))); return true;
    case 'registrarRecurrente': return fbRegistrarRecurrente(args[0],args[1],args[2]);
    case 'guardarConfig': enNube(setDoc(ud('config','app'),{[args[0]]:args[1]},{merge:true})); return true;
    case 'guardarCatalogo': return fbGuardarCatalogo(args[0],args[1]);
    case 'borrarCatalogo': enNube(deleteDoc(ud(FB_COLS[args[0]],String(args[1])))); return true;
    case 'guardarPresupuestos': return fbGuardarPresupuestos(args[0]);
    case 'estadoAlertas': return false;
    case 'instalarAlertas': case 'desinstalarAlertas': case 'probarAlerta':
      throw new Error('Las alertas por correo siguen en Apps Script; se reactivan con la sincronización nocturna.');
    default: throw new Error('Función no disponible: '+fn);
  }
}
const esRed=e=>!navigator.onLine||/network|red|conex|timeout|fetch|load failed|offline|unavailable/i.test(String(e&&e.message||e));

/* cola offline */
function cola(){return store.get(QUEUE_KEY)||[]}
function aplicarCola(){ // muestra lo pendiente encima de los datos del servidor
  cola().forEach(op=>{
    if(op.fn==='guardarMovimiento'){const m=op.args[0];const i=D.mov.findIndex(x=>x.id===m.id);const r={...m,id:m.id||op.tmp,_pend:true};if(i>=0)D.mov[i]=r;else D.mov.push(r)}
    if(op.fn==='borrarMovimiento'){D.mov=D.mov.filter(x=>x.id!==op.args[0])}
    if(op.fn==='registrarRecurrente'){const r=D.rec.find(x=>x.id===op.args[0]);if(r)r.prox=op.args[2];const m=op.args[1];if(m&&!D.mov.some(x=>x.id===op.tmp))D.mov.push({...m,id:op.tmp,_pend:true})}
  });
}
async function vaciarCola(){
  let q=cola(); if(!q.length) return;
  syncing(true);
  while(q.length){
    const op=q[0];
    try{ await api(op.fn,...op.args); q.shift(); store.set(QUEUE_KEY,q) }catch(e){ if(esRed(e)) break; q.shift(); store.set(QUEUE_KEY,q); toast('Error al sincronizar: '+(e.message||e)) }
  }
  syncing(false);
  if(!q.length){ await cargar(true); toast('Pendientes sincronizados') }
}
window.addEventListener('online',vaciarCola);

/* ============ cálculos ============ */
function saldos(){
  const s={}; D.met.forEach(m=>s[m.nombre]=m.inicial);
  D.mov.forEach(x=>{
    if(!(x.o in s)) s[x.o]=0;
    if(x.t==='Ingreso') s[x.o]+=x.m;
    else if(x.t==='Gasto') s[x.o]-=x.m;
    else if(x.t==='Transferencia'){ s[x.o]-=x.m; if(x.d){ if(!(x.d in s)) s[x.d]=0; s[x.d]+=x.m } }
  });
  return s;
}
/* fechas yyyy-mm-dd */
function fecha(y,m,d){while(m<1){m+=12;y--}while(m>12){m-=12;y++}const u=new Date(y,m,0).getDate();return y+'-'+String(m).padStart(2,'0')+'-'+String(Math.min(d,u)).padStart(2,'0')}
function partes(f){return String(f).split('-').map(Number)}
function dias(a,b){const x=partes(a),y=partes(b);return Math.round((new Date(y[0],y[1]-1,y[2])-new Date(x[0],x[1]-1,x[2]))/864e5)}
function diaTexto(f){ // "Lunes 23 de nov" (solo la primera letra en mayúscula, como se escribe en español)
  const p=partes(f), dd=new Date(p[0],p[1]-1,p[2]); const dia=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'][dd.getDay()];
  return dia[0].toUpperCase()+dia.slice(1)+' '+p[2]+' de '+MESES[p[1]-1].slice(0,3).toLowerCase()+(p[0]!==partes(D.hoy||hoyLocal())[0]?' '+p[0]:'')}
function fCorta(f){const p=partes(f);return p[2]+' '+MESES[p[1]-1].slice(0,3).toLowerCase()}
function cuando(n){return n<0?`hace ${-n} día${n===-1?'':'s'}`:n===0?'hoy':n===1?'mañana':`en ${n} días`}
const FRECS=['Semanal','Quincenal','Mensual','Bimestral','Trimestral','Anual'];
function avanzar(f,frec,dia){const p=partes(f);dia=dia||p[2];
  if(frec==='Semanal')return addDays(f,7); if(frec==='Quincenal')return addDays(f,15);
  const n={Mensual:1,Bimestral:2,Trimestral:3,Anual:12}[frec]||1; return fecha(p[0],p[1]+n,dia)}
/* tarjetas: fechas de corte y pago (misma lógica que el correo)
   - último corte = el día de corte más reciente que ya pasó (o es hoy)
   - fecha de pago = el primer día de pago DESPUÉS de ese corte
   - "pagado" = registraste al menos un pago (transferencia hacia la tarjeta) después de ese corte */
function estadoTarjetas(){
  const hoy=D.hoy||hoyLocal(), h=partes(hoy), sal=saldos();
  return D.tar.filter(t=>t.corte&&t.pago).map(t=>{
    let corte=fecha(h[0],h[1],t.corte); if(corte>hoy) corte=fecha(h[0],h[1]-1,t.corte);
    const c=partes(corte); let pago=fecha(c[0],c[1],t.pago); if(pago<=corte) pago=fecha(c[0],c[1]+1,t.pago);
    let pc=fecha(h[0],h[1],t.corte); if(pc<=hoy) pc=fecha(h[0],h[1]+1,t.corte);
    const pagosReg=D.mov.filter(x=>x.t==='Transferencia'&&x.d===t.met&&x.f>corte&&x.f<=hoy);
    return {...t,corteF:corte,pagoF:pago,proxCorte:pc,dias:dias(hoy,pago),diasCorte:dias(hoy,pc),
      pagado:pagosReg.length>0,pagadoMonto:pagosReg.reduce((a,x)=>a+x.m,0),deuda:sal[t.met]||0};
  });
}
/* utilización de tarjetas: deuda actual ÷ límite de crédito, contra el tope que elijas */
function utilizacion(){
  const sal=saldos();
  return D.tar.filter(t=>t.limite>0).map(t=>{const deuda=Math.max(0,-(sal[t.met]||0)), pct=deuda/t.limite*100, tope=t.alerta||0;
    const estado=!tope?'':pct>=tope?'pasado':pct>=tope*0.8?'cerca':'ok';
    return {met:t.met,limite:t.limite,deuda,pct,tope,topeMonto:tope*t.limite/100,estado}});
}
function utilBar(met){const u=utilizacion().find(x=>x.met===met); if(!u) return '';
  const col=u.estado==='pasado'?'var(--gas)':u.estado==='cerca'?'#F59E0B':'var(--ing)';
  return `<div class="ub"><div class="ub-top"><div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(1.5,u.pct))}%;background:${col}"></div></div><span class="num" style="color:${u.estado==='ok'||!u.estado?'var(--muted)':col}">${u.pct.toFixed(0)} %</span></div>
    <div class="ub-bot"><span>Deuda / Límite</span><span class="num">${fmt(u.deuda)} / ${fmt(u.limite)}</span></div></div>`}
/* la fecha más próxima de una tarjeta: pago pendiente o corte */
function fechaTarjeta(e){
  if(!e) return '<span style="color:var(--acc)">Configura corte y pago</span>';
  if(!e.pagado&&e.dias<0) return `<span class="gas">Pago vencido ${fCorta(e.pagoF)}</span>`;
  if(!e.pagado&&e.dias<=e.diasCorte) return `<span class="${e.dias<=3?'gas':e.dias<=7?'warn':''}">Fecha de pago ${fCorta(e.pagoF)}</span>`;
  return `<span class="${e.diasCorte<=2?'warn':''}">Fecha de corte ${fCorta(e.proxCorte)}</span>`;
}
function mejorOrigenPara(card){const u=uso(x=>x.t==='Transferencia'&&x.d===card,'o',365);return Object.keys(u).sort((a,b)=>u[b]-u[a])[0]||''}
function promedioGasto(cat,n=3){const hoyM=(D.hoy||hoyLocal()).slice(0,7);let t=0;for(let i=1;i<=n;i++){const m=mesAdd(hoyM,-i);t+=D.mov.filter(x=>x.t==='Gasto'&&x.c===cat&&enMes(x,m)).reduce((a,x)=>a+x.m,0)}return t/n}
function tipoMetodo(n){const m=D.met.find(x=>x.nombre===n);return m?m.tipo:'Débito'}
function enMes(x,ym){return x.f.slice(0,7)===ym}
function suma(arr,t){return arr.filter(x=>x.t===t).reduce((a,x)=>a+x.m,0)}
function uso(filtro,clave,dias=120){ // frecuencia de uso reciente para ordenar chips
  const lim=addDays(D.hoy||hoyLocal(),-dias); const c={};
  D.mov.forEach(x=>{ if(x.f>=lim && filtro(x)) { const k=x[clave]; if(k) c[k]=(c[k]||0)+1 } });

}
function masUsado(filtro,clave){ // lo más usado, dando prioridad a lo reciente (60 días; si no hay, 1 año)
  for(const d of [60,365]){const u=uso(filtro,clave,d);const k=Object.keys(u).sort((a,b)=>u[b]-u[a])[0];if(k)return k}return ''}
function ordenarRecientes(arr){ // por fecha y, dentro del mismo día, el último capturado primero
  const pos=new Map(D.mov.map((x,i)=>[x,i])); return [...arr].sort((a,b)=>b.f.localeCompare(a.f)||(pos.get(b)-pos.get(a)))}
function ordenarPorUso(lista,c){return [...lista].sort((a,b)=>(c[b]||0)-(c[a]||0)||a.localeCompare(b,'es'))}
function subcatsDe(cat){return [...new Set(D.sub.filter(s=>s.cat===cat).map(s=>s.nombre))]}
function catsDe(tipo){return [...new Set(D.cat.filter(c=>c.tipo===tipo).map(c=>c.nombre))]}

/* ============ navegación ============ */
const TITULOS={inicio:'Inicio',movs:'Movimientos',cuentas:'Cuentas',reportes:'Reportes',ajustes:'Ajustes'};
/* Navegación:
   - Inicio es la raíz (nivel 0). Movimientos/Cuentas/Reportes son nivel 1: "atrás" siempre regresa a Inicio.
   - Ajustes se abre encima de la página actual: "atrás" regresa a la página desde donde se abrió.
   - Formularios (ventanas) se abren encima de todo: "atrás" o la ✕ los cierran y dejan la página como estaba. */
function nivel(){return (history.state&&history.state.d)||0}
function ir(v,desdeAtras,pestana){
  // pestana=true: se tocó una pestaña de abajo. Si no, es un "detalle" (tocaste algo dentro de una página) y "atrás" regresa a esa página.
  if(!desdeAtras&&v!==S.view&&S.view!=='setup'){
    S.scroll[S.view]=scrollY;
    if(pestana&&v==='inicio'){ if(nivel()>0){ history.go(-nivel()); return } }
    else if(pestana&&nivel()>1){ // desde un detalle: vuelve al nivel de pestañas y cambia a la pestaña elegida
      S.despues=()=>{ history.replaceState({v,d:1},''); ir(v,true) }; history.go(-(nivel()-1)); return }
    else if(pestana&&S.view!=='inicio') history.replaceState({v,d:nivel()},'');
    else history.pushState({v,d:nivel()+1},'');
  }
  const mismo=v===S.view;
  if(!mismo) S.scroll[S.view]=scrollY;
  S.view=v; document.querySelectorAll('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));
  document.querySelectorAll('nav.bottom button[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  cerrarMenuRep(true); ponerTitulo(); render();
  if(!mismo) window.scrollTo(0,desdeAtras?(S.scroll[v]||0):0);
}
function abrirModal(id){ const el=$('#'+id); if(el.classList.contains('on')) return; clearTimeout(el._sal); el.classList.remove('saliendo'); el.classList.add('on'); history.pushState({modal:id,v:S.view,d:nivel()+1},'') }
function cerrarModal(id,despues){ const el=$('#'+id);
  if(!el.classList.contains('on')){ if(despues) despues(); return }
  if(history.state&&history.state.modal===id){ S.despues=despues||null; history.back() } else { ocultar(id); if(despues) despues() } }
function ocultar(id){ const el=$('#'+id); if(el.classList.contains('on')){ el.classList.remove('on'); el.classList.add('saliendo'); clearTimeout(el._sal); el._sal=setTimeout(()=>el.classList.remove('saliendo'),250) } if(id==='sheet') S.form=null }
window.addEventListener('popstate',e=>{

function itemHTML(x){

function barras(items,max,col,click){

}

/* Tarjetas de Inicio que se pueden mostrar/ocultar y ordenar (Ajustes → Página de inicio) */
const INICIO_TARJETAS=[['pre','Presupuesto del mes'],['pat','Disponible, deuda y patrimonio'],['gcat','Gastos por categoría'],['ult','Últimos movimientos'],['ritmo','Ritmo de gasto'],['icat','Ingresos por categoría']];
const INICIO_DEFECTO=['pre','pat','gcat','ult'];
function layoutInicio(){
  let l=[]; try{ l=JSON.parse(D.cfg.inicio_layout||'[]') }catch(e){ l=[] }
  if(!Array.isArray(l)||!l.length) l=INICIO_TARJETAS.map(([id])=>({id,on:INICIO_DEFECTO.includes(id)}));
  const ids=INICIO_TARJETAS.map(x=>x[0]); l=l.filter(x=>ids.includes(x.id));
  ids.forEach(id=>{ if(!l.some(x=>x.id===id)) l.push({id,on:false}) });
  return l;
}
function guardarLayout(l){
  D.cfg.inicio_layout=JSON.stringify(l); store.set(CACHE_KEY,D);
  clearTimeout(guardarLayout._t);
  guardarLayout._t=setTimeout(async()=>{ try{ await api('guardarConfig','inicio_layout',D.cfg.inicio_layout) }
    catch(e){ toast('No se guardó: ') } },900);
}
function rInicio(){
  const el=$('#v-inicio');
  const mm=D.mov.filter(x=>enMes(x,S.mes)), ing=suma(mm,'Ingreso'), gas=suma(mm,'Gasto');
  const hoyI=D.hoy||hoyLocal(), esActI=S.mes===hoyI.slice(0,7), diaI=partes(hoyI)[2];
  const gasP=esActI?gastoHastaDia(mesAdd(S.mes,-1),diaI):suma(D.mov.filter(x=>enMes(x,mesAdd(S.mes,-1))),'Gasto');
  const dp=gasP?((gas-gasP)/gasP*100):0;
  const byC={}; mm.filter(x=>x.t==='Gasto').forEach(x=>byC[x.c]=(byC[x.c]||0)+x.m);
  const T={
    pre:()=>presupuestoHTML(byC),
    pat:()=>{const sal=saldos();let disp=0,deuda=0;Object.entries(sal).forEach(([k,v])=>{if(tipoMetodo(k)==='Crédito')deuda+=v;else disp+=v});
      return `<div class="card" id="goCuentas" style="cursor:pointer"><h2>Patrimonio</h2><div class="hero">
      <div class="stat"><small>Disponible en cuentas</small><b class="num">${fmt(disp)}</b></div>
      <div class="stat"><small>Deuda en tarjetas</small><b class="num gas">${fmt(Math.abs(deuda))}</b></div>
      <div class="stat big"><small>Patrimonio neto</small><b class="num" style="font-size:calc(22px*var(--fs))">${fmt(disp+deuda)}</b></div></div></div>`},
    gcat:()=>{const top=Object.entries(byC).sort((a,b)=>b[1]-a[1]).slice(0,6);
      return `<div class="card" data-tipo="Gasto"><h2>Gastos por categoría</h2>${top.length?barras(top,top[0][1],k=>color(k),true):'<div class="muted small">Sin gastos este mes.</div>'}</div>`},
    icat:()=>{const o={};mm.filter(x=>x.t==='Ingreso').forEach(x=>o[x.c]=(o[x.c]||0)+x.m);const top=Object.entries(o).sort((a,b)=>b[1]-a[1]);
      return `<div class="card" data-tipo="Ingreso"><h2>Ingresos por categoría</h2>${top.length?barras(top,top[0][1],'var(--ing)',true):'<div class="muted small">Sin ingresos este mes.</div>'}</div>`},
    ult:()=>{const ult=ordenarRecientes(mm).slice(0,6);
      return `<div class="card" style="padding:0"><h2 style="padding:16px 16px 0">Últimos movimientos</h2><div class="items" style="box-shadow:none">${ult.map(itemHTML).join('')||'<div class="empty">Aún no hay movimientos este mes.<br>Toca + para agregar uno.</div>'}</div>
      ${mm.length>6?'<button class="tiny-btn" id="verTodos" style="margin:4px 8px 10px">Ver todos ('+mm.length+')</button>':''}</div>`},
    ritmo:()=>ritmoCardHTML(S.mes)
  };
  el.innerHTML=alertasHTML()+monthBar()+`
  <div class="card"><h2>Balance del mes</h2><div class="hero">
    <div class="stat big"><b class="num ${ing-gas>=0?'ing':'gas'}">${fmt(ing-gas)}</b></div>
    <div class="stat"><small>Ingresos</small><b class="num ing">${fmt(ing)}</b></div>
    <div class="stat"><small>Gastos</small><b class="num gas">${fmt(gas)}</b>${gasP?`<div class="delta muted">${dp>=0?'▲':'▼'} ${Math.abs(dp).toFixed(0)}% vs ${mesCorto(mesAdd(S.mes,-1))}${esActI?' al día '+diaI:''}</div>`:''}</div>
  </div></div>`+layoutInicio().filter(x=>x.on).map(x=>T[x.id]()).join('');
  bindMonth(el); bindItems(el); bindAlertas(el);
  const gc=el.querySelector('#goCuentas'); if(gc) gc.onclick=()=>ir('cuentas');
  el.querySelectorAll('[data-tipo] .bar-row[data-k]').forEach(r=>r.onclick=()=>{S.cat=r.dataset.k;S.sub='';S.acc='';S.tipo=r.closest('[data-tipo]').dataset.tipo;ir('movs')});
  const vt=el.querySelector('#verTodos'); if(vt) vt.onclick=()=>{S.cat='';S.acc='';S.tipo='';ir('movs')};
  el.querySelectorAll('.bud[data-k]').forEach(r=>r.onclick=()=>{S.cat=r.dataset.k;S.sub='';S.acc='';S.tipo='Gasto';ir('movs')});
  const gp=el.querySelector('#goPre'); if(gp) gp.onclick=formPresupuestos;
}

/* tarjetas por pagar + recurrentes próximos */

  const hoy=D.hoy||hoyLocal();
  const est=estadoTarjetas();
  const tj=est.filter(e=>!e.pagado&&e.dias<=7).sort((a,b)=>a.dias-b.dias);
  const cortes=est.filter(e=>e.diasCorte<=2).sort((a,b)=>a.diasCorte-b.diasCorte);
  const rc=D.rec.filter(r=>r.activo&&r.prox&&dias(hoy,r.prox)<=5).sort((a,b)=>a.prox.localeCompare(b.prox));
  const ut=utilizacion().filter(u=>u.estado==='cerca'||u.estado==='pasado').sort((a,b)=>b.pct/b.tope-a.pct/a.tope);
  if(!tj.length&&!rc.length&&!cortes.length&&!ut.length) return '';
  const badge=n=>n<0?'<span class="badge red">Vencido</span>':n<=3?'<span class="badge red">'+(n===0?'Hoy':n+' d')+'</span>':n<=7?'<span class="badge amber">'+n+' d</span>':'';
  const filas=[
    ...tj.map(e=>{const c=color(e.met);return `<div class="al-row"><div class="av" style="background:${c}22;color:${c}">${esc(iniciales(e.met))}</div><div class="mid"><div class="t1">Pago ${esc(e.met)}${badge(e.dias)}</div><div class="t2">${e.dias<0?'Fecha límite fue el '+fCorta(e.pagoF)+' · sin pago registrado':'Fecha límite '+fCorta(e.pagoF)+' · '+cuando(e.dias)}</div></div><div class="right"><div class="small muted">Deuda actual</div><div class="num gas" style="font-weight:700">${fmt(Math.abs(Math.min(0,e.deuda)))}</div><div class="al-btns"><button class="pill-btn" data-pay="${esc(e.met)}">Pagar</button></div></div></div>`}),
    ...ut.map(u=>{const c=color(u.met),p=u.estado==='pasado';return `<div class="al-row" data-util="${esc(u.met)}" style="cursor:pointer"><div class="av" style="background:${c}22;color:${c}">${esc(iniciales(u.met))}</div><div class="mid"><div class="t1" style="white-space:normal">${esc(u.met)}<span class="badge ${p?'red':'amber'}">${p?'Pasaste tu tope':'Cerca del tope'}</span></div><div class="t2">${u.pct.toFixed(0)}% usado · tope ${u.tope}%</div></div><div class="right"><div class="small muted">Deuda</div><div class="num ${p?'gas':''}" style="font-weight:700;${p?'':'color:#F59E0B'}">${fmt(u.deuda)}</div></div></div>`}),
    ...cortes.map(e=>{const c=color(e.met);return `<div class="al-row"><div class="av" style="background:${c}22;color:${c}">${esc(iniciales(e.met))}</div><div class="mid"><div class="t1">Corte ${esc(e.met)}<span class="badge amber">${e.diasCorte===0?'Hoy':cuando(e.diasCorte)}</span></div><div class="t2">${fCorta(e.proxCorte)}</div></div></div>`}),
    ...rc.map(r=>{const n=dias(hoy,r.prox);const c=r.t==='Transferencia'?'var(--tra)':color(r.c);const cls=r.t==='Ingreso'?'ing':r.t==='Gasto'?'gas':'tra';
      return `<div class="al-row"><div class="av" style="background:${c}22;color:${c}"><svg viewBox="0 0 24 24" style="width:18px;height:18px"><path d="M21 12a9 9 0 1 1-2.6-6.4"/><path d="M21 3v6h-6"/></svg></div><div class="mid"><div class="t1">${esc(r.nombre)}${badge(n)}</div><div class="t2">${r.frec} · ${fCorta(r.prox)} · ${cuando(n)}</div></div><div class="right"><div class="num ${cls}" style="font-weight:700">${fmt(r.m)}</div><div class="al-btns"><button class="pill-btn ghost" data-skip="${esc(r.id)}">Omitir</button><button class="pill-btn" data-reg="${esc(r.id)}">Registrar</button></div></div></div>`})
  ];
  return `<div class="card"><h2>Por pagar y próximos</h2>${filas.join('')}</div>`;
}

/* presupuesto del mes */
function presupuestoHTML(byC){
  if(!D.pre.length) return `<div class="card" style="display:flex;align-items:center;gap:10px"><div class="mid small muted" style="flex:1">Aún no tienes presupuestos por categoría.</div><button class="tiny-btn" id="goPre">Definir</button></div>`;
  const hoy=D.hoy||hoyLocal(), esActual=S.mes===hoy.slice(0,7);
  const p=partes(S.mes+'-01'), diasMes=new Date(p[0],p[1],0).getDate();
  const ritmo=esActual?partes(hoy)[2]/diasMes:1;
  const rows=D.pre.map(x=>({cat:x.cat,pre:x.monto,g:byC[x.cat]||0})).sort((a,b)=>b.g/b.pre-a.g/a.pre);
  const tp=rows.reduce((a,r)=>a+r.pre,0), tg=rows.reduce((a,r)=>a+r.g,0);
  const est=(g,pr)=>g>pr?'var(--gas)':g>pr*Math.max(ritmo,.8)?'#F59E0B':'var(--ing)';
  const fila=r=>{const pct=r.g/r.pre*100,q=r.pre-r.g;
    return `<div class="bud" data-k="${esc(r.cat)}"><div class="bud-top"><span>${esc(r.cat)}</span><span class="num small">${fmt0(r.g)} de ${fmt0(r.pre)}</span></div>
    <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(2,pct))}%;background:${est(r.g,r.pre)}"></div>${esActual?`<i class="pace" style="left:${ritmo*100}%"></i>`:''}</div>
    <div class="bud-sub">${q>=0?'Quedan '+fmt(q):'<span class="gas">Excedido por '+fmt(-q)+'</span>'} · ${pct.toFixed(0)}%</div></div>`};
  return `<div class="card"><h2 style="display:flex;justify-content:space-between"><span>Presupuesto del mes</span><button class="tiny-btn" id="goPre" style="padding:0">Editar</button></h2>
  <div class="bud" style="cursor:default"><div class="bud-top"><b>Total</b><span class="num small"><b>${fmt(tg)}</b> de ${fmt(tp)}</span></div>
  <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(2,tg/tp*100))}%;background:${est(tg,tp)}"></div>${esActual?`<i class="pace" style="left:${ritmo*100}%"></i>`:''}</div>
  <div class="bud-sub">${tp-tg>=0?'Disponible '+fmt(tp-tg):'<span class="gas">Excedido por '+fmt(tg-tp)+'</span>'}</div></div>
  <div style="border-top:1px solid var(--line);margin-top:6px;padding-top:4px">${rows.map(fila).join('')}</div></div>`;
}

function rMovs(){
  const el=$('#v-movs');
  const q=S.q.trim().toLowerCase();
  let f=D.mov.filter(x=>enMes(x,S.mes)&&(!S.tipo||x.t===S.tipo)&&(!S.acc||x.o===S.acc||x.d===S.acc)&&(!S.cat||x.c===S.cat)&&(!S.sub||x.s===S.sub));

  bindMonth(el); bindItems(el);
  const qi=el.querySelector('#q'); qi.oninput=()=>{S.q=qi.value;clearTimeout(qi._t);qi._t=setTimeout(()=>{rMovs();const n=$('#q');n.focus();cursorAlFinal(n)},250)};

function rCuentas(){
  const el=$('#v-cuentas'); const sal=saldos();
  const nombres=[...new Set([...D.met.map(m=>m.nombre),...Object.keys(sal)])].filter(Boolean);
  const grupos={'Débito':[], 'Efectivo':[], 'Crédito':[]};
  nombres.forEach(n=>{const t=tipoMetodo(n);(grupos[t]||(grupos[t]=[])).push(n)});
  let disp=0,deuda=0; nombres.forEach(n=>{ if(tipoMetodo(n)==='Crédito') deuda+=sal[n]||0; else disp+=sal[n]||0 });
  const titulo={'Débito':'Cuentas y ahorro','Efectivo':'Efectivo','Crédito':'Tarjetas de crédito'};
  const ET={}; estadoTarjetas().forEach(e=>ET[e.met]=e);
  const subT=(n,v)=>{const e=ET[n];
    if(!e) return (v<0?'Por pagar':'Sin deuda')+' · <span style="color:var(--acc)">configura corte y pago</span>';
    const lin=e.limite?` · línea disp. ${fmt0(e.limite+v)}`:'';
    const cor=`corte ${fCorta(e.proxCorte)}${e.diasCorte<=2?' ('+(e.diasCorte===0?'hoy':cuando(e.diasCorte))+')':''}`;
    if(!e.pagado&&e.dias<0) return `<span class="gas">Sin pago registrado (límite ${fCorta(e.pagoF)})</span> · ${cor}${lin}`;
    if(!e.pagado) return `<span class="${e.dias<=3?'gas':e.dias<=7?'warn':''}">Pagar antes del ${fCorta(e.pagoF)} (${cuando(e.dias)})</span> · ${cor}${lin}`;
    return `<span class="ing">Pago registrado ✓</span> · ${cor}${lin}`};
  el.innerHTML=`<div class="card"><h2>Patrimonio neto</h2><div class="hero">
    <div class="stat big"><b class="num">${fmt(disp+deuda)}</b></div>
    <div class="stat"><small>Disponible</small><b class="num ing">${fmt(disp)}</b></div>
    <div class="stat"><small>Deuda tarjetas</small><b class="num gas">${fmt(Math.abs(deuda))}</b></div></div></div>`+
  Object.entries(grupos).filter(([,a])=>a.length).map(([t,arr])=>{
    arr.sort((a,b)=>Math.abs(sal[b]||0)-Math.abs(sal[a]||0));
    const tot=arr.reduce((a,n)=>a+(sal[n]||0),0);
    return `<div class="card"><h2 style="display:flex;justify-content:space-between"><span>${titulo[t]||t}</span><span class="num">${fmt(tot)}</span></h2>${arr.map(n=>{const v=sal[n]||0;const c=color(n);
      if(t==='Crédito') return `<button class="acc-row cc ${Math.abs(v)<0.005&&!utilizacion().some(u=>u.met===n)?'zero':''}" data-acc="${esc(n)}"><div class="av" style="background:${c}22;color:${c}">${esc(iniciales(n))}</div><div class="mid"><div style="font-weight:600">${esc(n)}</div><div class="small muted">${fechaTarjeta(ET[n])}</div></div><div class="num" style="font-weight:700;${v<0?'color:var(--gas)':''}">${fmt(v)}</div>${utilBar(n)}</button>`;

function rangoRep(){

  if(S.rep==='mes') return {desde:S.mes,hasta:S.mes};

  if(S.rep==='anio') return {desde:hoyM.slice(0,4)+'-01',hasta:hoyM};

}
function rResumen(el){

  const gc=porCat('Gasto'), ic=porCat('Ingreso');
  const conSubs=(lista,t)=>lista.map(([c,v])=>{let extra='';if(S.repOpen[t+c]){const o={};f.filter(x=>x.t===t&&x.c===c).forEach(x=>o[x.s||'(sin subcategoría)']=(o[x.s||'(sin subcategoría)']||0)+x.m);const s=Object.entries(o).sort((a,b)=>b[1]-a[1]);extra=`<div class="sub-rows">${barras(s,s[0][1],color(c))}</div>`}return [c,v,extra]});
  const pm={};f.filter(x=>x.t==='Gasto').forEach(x=>pm[x.o]=(pm[x.o]||0)+x.m);const pmL=Object.entries(pm).sort((a,b)=>b[1]-a[1]);
  el.innerHTML=`<div class="chips per">${[['mes','Mes'],['3m','3 meses'],['6m','6 meses'],['anio','Este año'],['todo','Todo']].map(([k,l])=>`<button class="chip ${S.rep===k?'on':''}" data-r="${k}">${l}</button>`).join('')}</div>
  ${S.rep==='mes'?monthBar():`<div class="small muted" style="padding:0 4px 8px">${mesNombre(desde)} – ${mesNombre(hasta)}</div>`}
  <div class="card"><h2>Balance del periodo</h2><div class="hero">
    <div class="stat big"><b class="num ${ing-gas>=0?'ing':'gas'}">${fmt(ing-gas)}</b></div>
    <div class="stat"><small>Ingresos</small><b class="num ing">${fmt(ing)}</b></div>
    <div class="stat"><small>Gastos</small><b class="num gas">${fmt(gas)}</b>${nMeses>1?`<div class="delta muted">Promedio ${fmt0(gas/nMeses)}/mes</div>`:''}</div>
  </div></div>
  <div class="card"><h2>Ingresos vs gastos por mes</h2><div class="cols">${bm.map(([m,i,g])=>`<div class="col" title="${mesNombre(m)}: +${fmt0(i)} / -${fmt0(g)}"><div class="pair"><i style="height:${i/maxM*100}%;background:var(--ing)"></i><i style="height:${g/maxM*100}%;background:var(--gas)"></i></div><span>${mesCorto(m)}</span></div>`).join('')}</div>
  <div class="legend"><span><i style="background:var(--ing)"></i>Ingresos</span><span><i style="background:var(--gas)"></i>Gastos</span></div></div>
  <div class="card"><h2>Gastos por categoría</h2>${gc.length?barras(conSubs(gc,'Gasto'),gc[0][1],k=>color(k),true):'<div class="muted small">Sin gastos.</div>'}</div>
  <div class="card"><h2>Ingresos por categoría</h2>${ic.length?barras(conSubs(ic,'Ingreso'),ic[0][1],'var(--ing)',true):'<div class="muted small">Sin ingresos.</div>'}</div>

  if(S.rep==='mes') bindMonth(el);
  el.querySelectorAll('[data-r]').forEach(c=>c.onclick=()=>{S.rep=c.dataset.r;rReportes()});

    const t=card.querySelector('h2').textContent.startsWith('Ingresos por')?'Ingreso':'Gasto'; const k=t+r.dataset.k; S.repOpen[k]=!S.repOpen[k]; rReportes()}));
}

/* utilidades de gráficas (SVG) */
const fmtK=v=>{const a=Math.abs(v),s=v<0?'-':'';return a>=1000?s+'$'+(a/1000).toFixed(a>=10000?0:1)+'k':s+'$'+Math.round(a)};
function svgLineas(series,n,o={}){
  const W=340,H=o.h||170,pl=42,pr=10,pt=10,pb=22;
  const vals=series.flatMap(s=>s.v.filter(v=>v!=null));
  let max=Math.max(1,...vals), min=o.desdeCero===false?Math.min(...vals):0;
  if(o.desdeCero===false){const r=(max-min)||max*.1||1;max+=r*.12;min-=r*.12}else max*=1.08;
  const X=i=>pl+(n<=1?0:i*(W-pl-pr)/(n-1)), Y=v=>pt+(1-(v-min)/(max-min||1))*(H-pt-pb);
  let g='';
  for(let k=0;k<=3;k++){const v=min+(max-min)*k/3,y=Y(v);g+=`<line x1="${pl}" x2="${W-pr}" y1="${y}" y2="${y}" stroke="var(--line)" stroke-width="1"/><text x="${pl-6}" y="${y+3.5}" text-anchor="end" font-size="10" fill="var(--muted)">${fmtK(v)}</text>`}
  (o.xlab||[]).forEach(([i,t])=>g+=`<text x="${X(i)}" y="${H-6}" text-anchor="middle" font-size="10" fill="var(--muted)">${esc(t)}</text>`);
  if(o.marca!=null) g+=`<line x1="${X(o.marca)}" x2="${X(o.marca)}" y1="${pt}" y2="${H-pb}" stroke="var(--muted)" stroke-width="1" stroke-dasharray="3 3"/>`;
  series.forEach(s=>{let d='',last=null;s.v.forEach((v,i)=>{if(v==null)return;d+=(d?'L':'M')+X(i).toFixed(1)+' '+Y(v).toFixed(1);last=[X(i),Y(v)]});
    if(d) g+=`<path d="${d}" fill="none" stroke="${s.color}" stroke-width="${s.ancho||2.2}" ${s.punteada?'stroke-dasharray="5 4"':''} stroke-linejoin="round" stroke-linecap="round"/>`;
    if(last&&s.punto) g+=`<circle cx="${last[0]}" cy="${last[1]}" r="4" fill="${s.color}"/>`});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${g}</svg>`;
}
const leyenda=items=>`<div class="legend" style="flex-wrap:wrap">${items.map(([c,t,p])=>`<span><i style="background:${c};${p?'opacity:.55':''}"></i>${esc(t)}</span>`).join('')}</div>`;
function finMes(m){const p=partes(m+'-01');return fecha(p[0],p[1],31)}
function diasDelMes(m){const p=partes(m+'-01');return new Date(p[0],p[1],0).getDate()}
function saldoCuentaHasta(acc,f){let s=(D.met.find(m=>m.nombre===acc)||{}).inicial||0;
  D.mov.forEach(x=>{if(x.f>f)return;if(x.o===acc)s+=x.t==='Ingreso'?x.m:-x.m;if(x.t==='Transferencia'&&x.d===acc)s+=x.m});return s}
function gastoAcum(m,hastaDia,filtro){const a=new Array(hastaDia).fill(0);
  D.mov.forEach(x=>{if(x.t!=='Gasto'||!enMes(x,m)||(filtro&&!filtro(x)))return;const d=partes(x.f)[2];if(d<=hastaDia)a[d-1]+=x.m});
  for(let i=1;i<a.length;i++)a[i]+=a[i-1];return a}
function gastoHastaDia(m,dia,filtro){const dd=Math.min(dia,diasDelMes(m));const a=gastoAcum(m,dd,filtro);return a.length?a[a.length-1]:0}
function mesesConDatos(){const fs=D.mov.map(x=>x.f.slice(0,7)).sort();const ini=fs[0]||(D.hoy||hoyLocal()).slice(0,7),fin=(D.hoy||hoyLocal()).slice(0,7);const r=[];for(let m=ini;m<=fin&&r.length<240;m=mesAdd(m,1))r.push(m);return r}

/* ---- Ritmo del mes + categorías fuera de lo normal ---- */
function ritmoCardHTML(m){
  const hoy=D.hoy||hoyLocal(), esAct=m===hoy.slice(0,7), dm=diasDelMes(m), dia=esAct?partes(hoy)[2]:dm;
  const pm=mesAdd(m,-1), dp=diasDelMes(pm), n=Math.max(dm,dp);
  const cur=gastoAcum(m,dm).map((v,i)=>i<dia?v:null), prev=gastoAcum(pm,dp);
  const prom=[];const ant=[1,2,3].map(k=>mesAdd(m,-k)).filter(x=>D.mov.some(y=>enMes(y,x)));
  for(let i=0;i<n;i++){prom.push(ant.length?ant.reduce((a,mm)=>a+gastoHastaDia(mm,i+1),0)/ant.length:null)}
  const llevo=cur[dia-1]||0, prevAl=gastoHastaDia(pm,dia), dif=prevAl?(llevo-prevAl)/prevAl*100:0;
  const proy=esAct&&dia>=3?llevo/dia*dm:null;
  return `<div class="card"><h2>Ritmo de gasto</h2>
    <div class="hero" style="margin-bottom:8px">
      <div class="stat"><small>Llevas al día ${dia}</small><b class="num gas">${fmt(llevo)}</b></div>
      <div class="stat"><small>${mesCorto(pm)} al día ${Math.min(dia,dp)}</small><b class="num">${fmt(prevAl)}</b>${prevAl?`<div class="delta ${dif>0?'gas':'ing'}">${dif>0?'▲':'▼'} ${Math.abs(dif).toFixed(0)}% ${dif>0?'más rápido':'más lento'}</div>`:''}</div>
      ${proy?`<div class="stat big"><small>Proyección al cierre</small><b class="num" style="font-size:calc(22px*var(--fs))">${fmt(proy)}</b></div>`:''}
    </div>
    ${svgLineas([{v:prom,color:'#F59E0B',punteada:true,ancho:1.8},{v:prev,color:'var(--tra)',ancho:2},{v:cur,color:'var(--gas)',punto:true,ancho:2.6}],n,{xlab:[[0,'1'],[9,'10'],[19,'20'],[n-1,String(n)]],marca:esAct?dia-1:null})}
    ${leyenda([['var(--gas)',mesNombre(m)],['var(--tra)',mesNombre(pm)],['#F59E0B','Promedio 3 meses']])}
  </div>`;
}
function rRitmo(el){
  const hoy=D.hoy||hoyLocal(), m=S.mes, esAct=m===hoy.slice(0,7), dm=diasDelMes(m), dia=esAct?partes(hoy)[2]:dm;
  const pm=mesAdd(m,-1), dp=diasDelMes(pm), n=Math.max(dm,dp);
  const cur=gastoAcum(m,dm).map((v,i)=>i<dia?v:null), prev=gastoAcum(pm,dp);
  const prom=[];const ant=[1,2,3].map(k=>mesAdd(m,-k)).filter(x=>D.mov.some(y=>enMes(y,x)));
  for(let i=0;i<n;i++){prom.push(ant.length?ant.reduce((a,mm)=>a+gastoHastaDia(mm,i+1),0)/ant.length:null)}
  const llevo=cur[dia-1]||0, prevAl=gastoHastaDia(pm,dia), dif=prevAl?(llevo-prevAl)/prevAl*100:0;
  const proy=esAct&&dia>=3?llevo/dia*dm:null;
  const cats=catsDe('Gasto').map(c=>{const a=gastoHastaDia(m,dia,x=>x.c===c);const p=ant.length?ant.reduce((s,mm)=>s+gastoHastaDia(mm,dia,x=>x.c===c),0)/ant.length:0;return {c,a,p,d:a-p,pct:p?(a-p)/p*100:null}})
    .filter(x=>x.a>0||x.p>0).sort((a,b)=>b.d-a.d);
  el.innerHTML=monthBar()+ritmoCardHTML(m)+`
  <div class="card"><h2>Categorías vs tu promedio</h2><div class="small muted" style="margin:-4px 0 8px">Al día ${dia} vs tu promedio</div>
    ${cats.length?cats.map(x=>{const up=x.d>0, fuerte=x.pct!=null&&Math.abs(x.pct)>=20;
      return `<div class="al-row bud" data-k="${esc(x.c)}" style="cursor:pointer"><div class="av" style="background:${color(x.c)}22;color:${color(x.c)}">${esc(iniciales(x.c))}</div><div class="mid"><div class="t1">${esc(x.c)}</div><div class="t2">${fmt0(x.a)} vs ${fmt0(x.p)} promedio</div></div><div class="right"><div class="num ${up?'gas':'ing'}" style="font-weight:700">${up?'+':'-'}${fmt0(Math.abs(x.d))}</div>${x.pct==null?'<span class="badge amber">nuevo</span>':`<span class="badge ${up&&fuerte?'red':!up&&fuerte?'':'amber'}" style="${!up&&fuerte?'background:var(--ing-soft);color:var(--ing)':''}">${up?'+':''}${x.pct.toFixed(0)}%</span>`}</div></div>`}).join(''):'<div class="muted small">Sin datos.</div>'}
  </div>`;
  bindMonth(el);
  el.querySelectorAll('.bud[data-k]').forEach(r=>r.onclick=()=>{S.cat=r.dataset.k;S.sub='';S.acc='';S.tipo='Gasto';ir('movs')});
}

/* ---- Tarjetas: lo que llevas en el periodo actual ---- */

    const g=D.mov.filter(x=>x.o===t&&x.t==='Gasto'&&x.f>e.corteF&&x.f<=hoy);
    const tot=g.reduce((a,x)=>a+x.m,0), byC={}; g.forEach(x=>byC[x.c]=(byC[x.c]||0)+x.m);

      <div class="hero" style="margin-bottom:6px"><div class="stat"><small>Llevas en este periodo</small><b class="num gas">${fmt(tot)}</b><div class="delta muted">${g.length} compras desde el ${fCorta(addDays(e.corteF,1))}</div></div>
      <div class="stat"><small>Periodo anterior completo</small><b class="num">${fmt(ant)}</b><div class="delta muted">Deuda actual ${fmt(Math.abs(Math.min(0,sal[t]||0)))}</div></div></div>

/* ---- Patrimonio y ahorro ---- */
function rPatrimonio(el){
  const hoy=D.hoy||hoyLocal(), meses=mesesConDatos();
  const ini=D.met.reduce((a,m)=>a+(m.inicial||0),0);
  const pat=meses.map(m=>{const fin=m===hoy.slice(0,7)?hoy:finMes(m);return ini+D.mov.filter(x=>x.f<=fin).reduce((a,x)=>a+(x.t==='Ingreso'?x.m:x.t==='Gasto'?-x.m:0),0)});
  const filas=meses.map((m,i)=>{const a=D.mov.filter(x=>enMes(x,m));const I=suma(a,'Ingreso'),G=suma(a,'Gasto');return {m,I,G,A:I-G,t:I?(I-G)/I*100:null,p:pat[i]}});
  const tot=filas.reduce((a,f)=>({I:a.I+f.I,G:a.G+f.G}),{I:0,G:0}); const tasa=tot.I?(tot.I-tot.G)/tot.I*100:0;
  const cambio=pat[pat.length-1]-ini;
  el.innerHTML=`<div class="card"><h2>Patrimonio neto hoy</h2><div class="hero">
    <div class="stat big"><b class="num">${fmt(pat[pat.length-1]||ini)}</b><div class="delta ${cambio>=0?'ing':'gas'}">${cambio>=0?'▲':'▼'} ${fmt(Math.abs(cambio))} desde ${mesNombre(meses[0]).toLowerCase()}</div></div>
    <div class="stat"><small>Tasa de ahorro total</small><b class="num ${tasa>=0?'ing':'gas'}">${tasa.toFixed(1)}%</b></div>
    <div class="stat"><small>Ahorro promedio</small><b class="num ${tot.I-tot.G>=0?'ing':'gas'}">${fmt0((tot.I-tot.G)/meses.length)}/mes</b></div></div></div>

/* ---- Inversiones: rendimientos (ingresos con categoría Inversión) ---- */
function rInversiones(el){
  const hoy=D.hoy||hoyLocal(), rend=D.mov.filter(x=>x.t==='Ingreso'&&x.c==='Inversión');
  if(!rend.length){el.innerHTML='<div class="empty">Aún no hay ingresos con la categoría Inversión.</div>';return}
  const plats=[...new Set(rend.map(x=>x.o))]; const tot={};rend.forEach(x=>tot[x.o]=(tot[x.o]||0)+x.m); plats.sort((a,b)=>tot[b]-tot[a]);
  const PC=['#8B5CF6','#3B82F6','#22C55E','#F59E0B','#EC4899','#14B8A6','#EF4444','#A3A3A3']; const cp=p=>PC[plats.indexOf(p)%PC.length];
  const meses=mesesConDatos().filter(m=>m>=rend.map(x=>x.f.slice(0,7)).sort()[0]);
  const por=meses.map(m=>{const o={};plats.forEach(p=>o[p]=0);rend.filter(x=>enMes(x,m)).forEach(x=>o[x.o]+=x.m);return o});
  const totMes=por.map(o=>Object.values(o).reduce((a,b)=>a+b,0)); const maxM=Math.max(1,...totMes);
  const total=rend.reduce((a,x)=>a+x.m,0);
  const completos=meses.filter(m=>m<hoy.slice(0,7)), ult=completos[completos.length-1];
  const ultTot=ult?totMes[meses.indexOf(ult)]:0;
  const ult3=completos.slice(-3), prom3=ult3.length?ult3.reduce((a,m)=>a+totMes[meses.indexOf(m)],0)/ult3.length:0;
  const acum=[];totMes.reduce((a,v,i)=>(acum[i]=a+v),0);
  const filas=plats.map(p=>{const rs=rend.filter(x=>x.o===p).sort((a,b)=>a.f.localeCompare(b.f));const u=rs[rs.length-1];
    const base=saldoCuentaHasta(p,addDays(u.f.slice(0,7)+'-01',-1)); const saldoHoy=saldoCuentaHasta(p,hoy);
    const tasa=base>0?u.m/base*12*100:null; return {p,t:tot[p],u,base,saldoHoy,tasa}});
  // meta de ingreso pasivo
  const meta=Number(D.cfg.meta_pasivo)||0;
  const capital=filas.reduce((a,f)=>a+Math.max(0,f.saldoHoy),0), tasaProm=capital>0?prom3*12/capital:0;
  const metaHTML=meta?(()=>{const pct=prom3/meta*100, falta=meta-prom3, extra=tasaProm>0&&falta>0?falta*12/tasaProm:0;
    return `<div class="card"><h2 style="display:flex;justify-content:space-between"><span>Meta de ingreso pasivo</span><button class="tiny-btn" id="edMeta" style="padding:0">Editar</button></h2>
      <div class="bud" style="cursor:default"><div class="bud-top"><span>Promedio últimos 3 meses</span><span class="num small"><b>${fmt(prom3)}</b> de ${fmt(meta)}/mes</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${Math.min(100,Math.max(2,pct))}%;background:var(--ing)"></div></div>
      <div class="bud-sub">${falta>0?`${pct.toFixed(0)}% de tu meta · te faltan ${fmt(falta)} al mes`:'<span class="ing">¡Meta alcanzada!</span> · '+pct.toFixed(0)+'%'}</div></div>
      ${falta>0&&extra?`<p class="small muted" style="margin:8px 0 0">Para llegar: invertir ≈ <b>${fmt0(extra)}</b> más</p>`:''}</div>`})()
    :`<div class="card" style="display:flex;align-items:center;gap:10px"><div class="small muted" style="flex:1">Sin meta de ingreso pasivo</div><button class="tiny-btn" id="edMeta">Definir meta</button></div>`;
  // generado por mes (valores)
  const tablaHTML=`<div class="card"><h2>Generado por mes</h2>${meses.map((m,i)=>({m,i})).reverse().map(({m,i})=>`<div class="al-row"><div class="mid"><div class="t1">${mesNombre(m)}${m===hoy.slice(0,7)?' <span class="small muted">(en curso)</span>':''}</div><div class="t2">${plats.filter(p=>por[i][p]).map(p=>esc(p)+' '+fmt0(por[i][p])).join(' · ')||'—'}</div></div><div class="right"><div class="num ing" style="font-weight:700">${fmt(totMes[i])}</div><div class="small muted">acum. ${fmt0(acum[i])}</div></div></div>`).join('')}
    <div class="al-row"><div class="mid"><b>Total</b></div><div class="right num ing" style="font-weight:800">${fmt(total)}</div></div></div>`;
  el.innerHTML=metaHTML+`<div class="card"><h2>Tus inversiones te han generado</h2><div class="hero">
    <div class="stat big"><b class="num ing">${fmt(total)}</b><div class="delta muted">desde ${mesNombre(meses[0]).toLowerCase()}</div></div>
    <div class="stat"><small>Último mes (${ult?mesCorto(ult):'—'})</small><b class="num ing">${fmt(ultTot)}</b></div>
    <div class="stat"><small>Al año, a este ritmo</small><b class="num ing">${fmt0(prom3*12)}</b></div></div></div>
  <div class="card"><h2>Rendimiento por mes</h2>
    <div class="cols" style="height:170px">${meses.map((m,i)=>`<div class="col" title="${mesNombre(m)}: ${fmt(totMes[i])}"><span class="num" style="font-size:calc(10px*var(--fs))">${totMes[i]?fmtK(totMes[i]):''}</span><div class="stack" style="height:${totMes[i]/maxM*100}%">${plats.map(p=>por[i][p]?`<i style="flex:${por[i][p]};background:${cp(p)}"></i>`:'').join('')}</div><span>${mesCorto(m)}</span></div>`).join('')}</div>
    ${leyenda(plats.map(p=>[cp(p),p]))}</div>
  ${tablaHTML}
  <div class="card"><h2>Acumulado</h2>${svgLineas([{v:acum,color:'var(--ing)',punto:true,ancho:2.6}],acum.length,{xlab:meses.map((m,i)=>[i,mesCorto(m)])})}</div>
  <div class="card"><h2>Por plataforma</h2>
    ${filas.map(f=>`<div class="al-row"><div class="av" style="background:${cp(f.p)}22;color:${cp(f.p)}">${esc(iniciales(f.p))}</div><div class="mid"><div class="t1">${esc(f.p)}</div><div class="t2">Saldo ${fmt0(f.saldoHoy)} · último ${fmt(f.u.m)} (${fCorta(f.u.f)})</div></div><div class="right"><div class="num ing" style="font-weight:700">${fmt(f.t)}</div><div class="small ${f.tasa!=null?'ing':'muted'}">${f.tasa!=null?'≈ '+f.tasa.toFixed(1)+'% anual':'—'}</div></div></div>`).join('')}
  </div>`;
  el.querySelector('#edMeta').onclick=formMeta;
}

function exportar(){
  const h=['IdMovimiento','Fecha','Tipo','Categoría','Subcategoría','Metodo_origen','Metodo_destino','Importe','Nota'];
  const q=v=>'"'+String(v??'').replace(/"/g,'""')+'"';
  const rows=[...D.mov].sort((a,b)=>a.f.localeCompare(b.f)).map(x=>[x.id,x.f,x.t,x.c,x.s,x.o,x.d,x.m,x.n].map(q).join(','));
  const blob=new Blob(['﻿'+h.join(',')+'\n'+rows.join('\n')],{type:'text/csv;charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='movimientos-'+(D.hoy||hoyLocal())+'.csv';document.body.appendChild(a);a.click();a.remove();
}
