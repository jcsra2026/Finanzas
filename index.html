/* Campos editables (data-ce): se comportan como <input> (tienen .value) pero Chrome no les pone su barra de autocompletar */
function limpiarNumero(t,modo){ if(modo==='numeric') return String(t).replace(/[^0-9]/g,''); if(modo==='signed'){ const neg=/^\s*-/.test(t); return (neg?'-':'')+limpiarImporte(t) } return limpiarImporte(t) }
function activarCampos(root){
  (root||document).querySelectorAll('[data-ce]:not([data-ce-ok])').forEach(el=>{
    el.setAttribute('data-ce-ok','');
    Object.defineProperty(el,'value',{configurable:true,
      get(){ const t=el.innerText.replace(/\n+$/,''); return el.dataset.num?limpiarNumero(t,el.dataset.num):t },
      set(v){ el.textContent=v==null?'':String(v) }});
    el.addEventListener('input',()=>{
      if(!el.innerText.trim()&&el.innerHTML!==''){ el.innerHTML='' }
      if(el.dataset.num){ const t=el.textContent, l=limpiarNumero(t,el.dataset.num); if(l!==t){ el.textContent=l; cursorAlFinal(el) } }
    },true);
    el.addEventListener('keydown',e=>{ if(e.key==='Enter'&&!el.classList.contains('nota')){ e.preventDefault(); el.blur() } });
    el.addEventListener('paste',e=>{ e.preventDefault(); document.execCommand('insertText',false,(e.clipboardData||window.clipboardData).getData('text')) });
  });
}
new MutationObserver(()=>activarCampos()).observe(document.documentElement,{childList:true,subtree:true});
function limpiarImporte(t){ // solo números y un punto decimal (la coma cuenta como punto), máximo 2 decimales
  t=String(t).replace(/,/g,'.').replace(/[^0-9.]/g,''); const i=t.indexOf('.');
  if(i>=0) t=t.slice(0,i+1)+t.slice(i+1).replace(/\./g,'').slice(0,2);
  return t;
}
function cursorAlFinal(el){ const r=document.createRange(); r.selectNodeContents(el); r.collapse(false); const s=getSelection(); s.removeAllRanges(); s.addRange(r) }
function chipsHTML(lista,sel,attr,extra=''){return lista.map(v=>`<button class="chip ${v===sel?'on':''}" data-${attr}="${esc(v)}">${esc(v)}</button>`).join('')+extra}

async function guardar(otro){
  const F=S.form; const imp=parseFloat(String(F.m).replace(/[^0-9.]/g,''));
  if(!(imp>0)) return toast('Escribe el importe');
  if(F.t!=='Transferencia'&&!F.c) return toast('Elige una categoría');
  if(!F.o) return toast(F.t==='Transferencia'?'Elige la cuenta de origen':'Elige el método de pago');
  if(F.t==='Transferencia'&&!F.d) return toast('Elige la cuenta destino');
  const nuevo=!F.id;
  const m={id:F.id||('n'+Date.now().toString(36)),f:F.f,t:F.t,c:F.t==='Transferencia'?'Transferencia':F.c,s:F.s||'',o:F.o,d:F.t==='Transferencia'?F.d:'',m:Math.round(imp*100)/100,n:(F.n||'').trim()};
  // actualización optimista
  const i=D.mov.findIndex(x=>x.id===m.id); if(i>=0) D.mov[i]=m; else D.mov.push(m);
  const rec=F._rec?D.rec.find(x=>x.id===F._rec):null, sig=rec?avanzar(rec.prox,rec.frec,rec.dia):'';
  if(rec) rec.prox=sig;
  if(otro){ S.form={id:'',f:F.f,t:F.t,c:'',s:'',o:F.o,d:'',m:'',n:'',_fab:F._fab}; dibujarForm(true); S.mes=m.f.slice(0,7); render() }
  else if(nuevo&&F._fab){ cerrarModal('sheet',()=>{ S.mes=m.f.slice(0,7); S.q='';S.tipo='';S.acc='';S.cat='';S.sub=''; ir('movs',false,true); window.scrollTo(0,0) }) }
  else { cerrarForm(); S.mes=m.f.slice(0,7); render() } toast(rec?'Registrado · siguiente '+fCorta(sig):nuevo?'Guardado':'Actualizado');
  syncing(true);
  const payload={...m,id:nuevo?'':m.id};
  try{
    const id=rec?await api('registrarRecurrente',rec.id,payload,sig):await api('guardarMovimiento',payload);
    const j=D.mov.findIndex(x=>x.id===m.id); if(j>=0) D.mov[j]={...m,id}; store.set(CACHE_KEY,D); render();
  }catch(e){
    if(esRed(e)){ const q=cola(); q.push(rec?{fn:'registrarRecurrente',args:[rec.id,payload,sig],tmp:m.id}:{fn:'guardarMovimiento',args:[{...payload,id:m.id&&!nuevo?m.id:''}],tmp:m.id}); store.set(QUEUE_KEY,q); const j=D.mov.findIndex(x=>x.id===m.id); if(j>=0) D.mov[j]._pend=true; render(); toast('Sin conexión: se guardará al reconectar') }
    else { toast('No se pudo guardar: '+(e.message||e)); await cargar(true) }
  }
  syncing(false);
}
async function borrar(id){
  if(!(await confirmar('¿Borrar este movimiento?'))) return;
  D.mov=D.mov.filter(x=>x.id!==id); cerrarForm(); render(); syncing(true);
  try{ await api('borrarMovimiento',id); store.set(CACHE_KEY,D); toast('Borrado') }
  catch(e){ if(esRed(e)){const q=cola();q.push({fn:'borrarMovimiento',args:[id]});store.set(QUEUE_KEY,q);toast('Se borrará al reconectar')} else {toast('Error: '+(e.message||e));await cargar(true)} }
  syncing(false);
}

/* ============ captura por voz ============
   Tocas el micrófono, dices p. ej. "Gasté 250 en Chedraui con la BBVA oro" y se abre el
   formulario ya llenado para que lo revises y guardes. Usa el reconocimiento de voz de Chrome (necesita internet). */
const RecVoz=window.SpeechRecognition||window.webkitSpeechRecognition;
const sinAcentos=t=>String(t||'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
const NUM_PAL={cero:0,un:1,uno:1,una:1,dos:2,tres:3,cuatro:4,cinco:5,seis:6,siete:7,ocho:8,nueve:9,diez:10,once:11,doce:12,trece:13,catorce:14,quince:15,dieciseis:16,diecisiete:17,dieciocho:18,diecinueve:19,
  veinte:20,veintiuno:21,veintiun:21,veintidos:22,veintitres:23,veinticuatro:24,veinticinco:25,veintiseis:26,veintisiete:27,veintiocho:28,veintinueve:29,treinta:30,cuarenta:40,cincuenta:50,sesenta:60,setenta:70,ochenta:80,noventa:90,
  cien:100,ciento:100,doscientos:200,doscientas:200,trescientos:300,trescientas:300,cuatrocientos:400,cuatrocientas:400,quinientos:500,quinientas:500,seiscientos:600,seiscientas:600,setecientos:700,setecientas:700,ochocientos:800,ochocientas:800,novecientos:900,novecientas:900};
function numeroEnPalabras(n){ // "dos mil quinientos cincuenta" -> 2550 (si el reconocimiento no puso dígitos)
  const ps=n.split(/\s+/); let mejor=null;
  for(let i=0;i<ps.length;i++){
    if(!(ps[i] in NUM_PAL)&&ps[i]!=='mil') continue;
    let total=0,parcial=0,usados=0;
    for(let j=i;j<ps.length;j++){ const w=ps[j];
      if(w==='y'&&usados) continue;
      if(w in NUM_PAL){ parcial+=NUM_PAL[w]; usados++ } else if(w==='mil'){ total+=(parcial||1)*1000; parcial=0; usados++ } else break; }
    const v=total+parcial; if(usados&&v>0&&(mejor===null||v>mejor)) mejor=v;
  }
  return mejor;
}
function fechaDeVoz(n,hoy){
  if(/\b(anteayer|antier)\b/.test(n)) return addDays(hoy,-2);
  if(/\bayer\b/.test(n)) return addDays(hoy,-1);
  const dias=['domingo','lunes','martes','miercoles','jueves','viernes','sabado'];
  const md=n.match(/\b(?:el |este |el pasado )?(domingo|lunes|martes|miercoles|jueves|viernes|sabado)\b/);
  if(md){ const p=partes(hoy), d=new Date(p[0],p[1]-1,p[2]).getDay(); let k=(d-dias.indexOf(md[1])+7)%7; return addDays(hoy,-k) }
  const mf=n.match(/\bel (\d{1,2})(?: de (enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre))?\b/);
  if(mf){ const p=partes(hoy); let mes=mf[2]?MESES.map(sinAcentos).indexOf(mf[2])+1:p[1], y=p[0]; let f=fecha(y,mes,+mf[1]); if(f>hoy) f=mf[2]?fecha(y-1,mes,+mf[1]):fecha(y,mes-1,+mf[1]); return f }
  return hoy;
}
function importeDeVoz(texto,n){
  let t=String(texto).replace(/\bel \d{1,2}( de [a-záéíóú]+)?\b/gi,' ');           // no confundir el día con el importe
  const m=t.match(/\$?\s*(\d{1,3}(?:[,\s]\d{3})+(?:\.\d{1,2})?|\d+(?:[.,]\d{1,2})?)/);
  let v=null;
  if(m){ let s=m[1]; if(/^\d{1,3}([,\s]\d{3})+/.test(s)) s=s.replace(/[,\s]/g,''); else s=s.replace(',','.'); v=parseFloat(s) }
  if(v===null) v=numeroEnPalabras(n.replace(/\bel (\w+) de \w+\b/,' '));
  const c=n.match(/\bcon (\d{1,2}) centavos\b/); if(v!==null&&c) v=Math.floor(v)+(+c[1])/100;
  return v;
}
function interpretarVoz(texto){
  const hoy=D.hoy||hoyLocal(), n=' '+sinAcentos(texto).replace(/[.,;:!?¿¡]/g,' ').replace(/\s+/g,' ')+' ';
  let t='Gasto';
  if(/\b(me pagaron|me depositaron|me deposito|me dieron|me regalaron|me cayo|me llego|recibi|cobre|ingreso de|nomina|sueldo|quincena)\b/.test(n)) t='Ingreso';
  if(/\b(transferi|transferencia|pase|traspase|traspaso|movi|abone|pague (?:la |mi )?(?:tarjeta|tdc)|pago (?:de|a) (?:la )?(?:tarjeta|tdc))\b/.test(n)) t='Transferencia';
  // menciones de tus nombres (el más largo gana)
  const cands=[];
  const agregar=(frase,tipo,val,exacto)=>{ const f=sinAcentos(frase).trim(); if(f.length<2) return;
    const re=new RegExp('(?<=\\s)'+f.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(?=\\s)','g'); let m; while((m=re.exec(n))) cands.push({tipo,val,ini:m.index,fin:m.index+f.length,largo:f.length+(exacto?0.5:0)}) };
  D.met.forEach(x=>{ agregar(x.nombre,'met',x.nombre,true); const r=x.nombre.replace(/^TDC\s+/i,''); if(r!==x.nombre){ agregar(r,'met',x.nombre,false); agregar('tarjeta '+r,'met',x.nombre,true); agregar('tdc '+r,'met',x.nombre,true) } });
  D.sub.forEach(x=>{ if(!/^otros?$/i.test(x.nombre)) agregar(x.nombre,'sub',x,true) });
  D.cat.forEach(x=>{ if(x.tipo!=='Transferencia') agregar(x.nombre,'cat',x,true) });
  cands.sort((a,b)=>b.largo-a.largo);
  const ocupado=[], usar=[];
  cands.forEach(c=>{ const choca=ocupado.some(o=>c.ini<o.fin&&o.ini<c.fin&&!(o.ini===c.ini&&o.fin===c.fin)); if(!choca){ usar.push(c); if(!ocupado.some(o=>o.ini===c.ini&&o.fin===c.fin)) ocupado.push(c) } });
  const antes=c=>n.slice(Math.max(0,c.ini-16),c.ini);
  const CUE_MET=/(con|con la|con el|con mi|con mis|usando|pague con|desde|de la|de mi|del)\s$/, CUE_DEST=/(\ba|al|a la|a mi|hacia|para|para la|pague la|pague mi|pague)\s$/, CUE_LUGAR=/(en|en el|en la|en los|de|del)\s$/;
  const mets=usar.filter(c=>c.tipo==='met'), subs=usar.filter(c=>c.tipo==='sub'), catsM=usar.filter(c=>c.tipo==='cat');
  const mismaPos=(a,b)=>a.ini===b.ini&&a.fin===b.fin;
  let o='',d='',sub=null,cat=null;
  if(t==='Transferencia'){
    const dest=mets.find(c=>CUE_DEST.test(antes(c))), ori=mets.find(c=>c!==dest&&CUE_MET.test(antes(c)));
    d=dest?dest.val:''; o=ori?ori.val:'';
    const libres=mets.filter(c=>c!==dest&&c!==ori&&c.val!==d&&c.val!==o);
    if(!o&&libres.length) o=libres.shift().val; if(!d&&libres.length) d=libres.shift().val;
  }else{
    // método: con pista "con ..."; si el mismo nombre es lugar ("en Costco"), es subcategoría
    let m=mets.find(c=>CUE_MET.test(antes(c)))||mets.find(c=>!subs.some(s=>mismaPos(s,c)));
    if(!m&&t==='Ingreso') m=mets[0];
    o=m?m.val:'';
    const s=subs.filter(c=>!(m&&mismaPos(c,m))&&D.cat.some(k=>k.nombre===c.val.cat&&k.tipo===t)).concat(subs.filter(c=>!(m&&mismaPos(c,m))));
    if(s.length){ const opciones=D.sub.filter(x=>sinAcentos(x.nombre)===sinAcentos(s[0].val.nombre)); const u=uso(x=>true,'c',365);
      sub=opciones.sort((a,b)=>(u[b.cat]||0)-(u[a.cat]||0))[0]; cat=sub.cat }
    if(!cat){ const k=catsM.find(c=>c.val.tipo===t)||catsM[0]; if(k){ cat=k.val.nombre; if(k.val.tipo!==t&&t==='Gasto') t=k.val.tipo } }
    if(cat){ const tc=(D.cat.find(k=>k.nombre===cat)||{}).tipo; if(tc&&tc!=='Transferencia'&&tc!==t&&t==='Gasto') t=tc }
    if(!o){ o=masUsado(x=>x.t===t&&(!cat||x.c===cat),'o')||masUsado(x=>x.t===t,'o') }
  }
  const dicho={t:t!=='Gasto'||/\b(gaste|gasto|compre|pague)\b/.test(n), m:importeDeVoz(texto,n)!=null, f:fechaDeVoz(n,hoy)!==hoy, c:!!cat||t==='Transferencia', o:!!mets.length, d:!!d};
  return {id:'',t,m:importeDeVoz(texto,n)??'',f:fechaDeVoz(n,hoy),c:t==='Transferencia'?'Transferencia':(cat||''),s:sub?sub.nombre:'',o,d,n:'',_dicho:dicho};
}
let VOZ=null, VOZ_T=null;
function escucharVoz(){
  if(!RecVoz){ toast('Tu navegador no permite dictar aquí'); return }
  if(!navigator.onLine){ toast('Para dictar necesitas internet'); return }
  const veil=$('#vozVeil'), txt=$('#vozTxt'), est=$('#vozEstado'); let final='', fallo='';
  const estado=(t,err)=>{ est.textContent=t; est.classList.toggle('gas',!!err) };
  txt.textContent=''; estado('Preparando el micrófono…'); $('#vozCancel').textContent='Cancelar'; veil.classList.add('on'); veil.classList.remove('error');
  VOZ=new RecVoz(); VOZ.lang='es-MX'; VOZ.interimResults=true; VOZ.maxAlternatives=1; VOZ.continuous=false;
  VOZ.onstart=()=>estado('Escuchando… habla ahora');
  VOZ.onaudiostart=()=>estado('Escuchando… habla ahora');
  VOZ.onspeechstart=()=>estado('Te escucho…');
  VOZ.onspeechend=()=>estado('Procesando…');
  VOZ.onresult=e=>{ let inter=''; for(let i=e.resultIndex;i<e.results.length;i++){ const r=e.results[i]; if(r.isFinal) final+=r[0].transcript; else inter+=r[0].transcript } txt.textContent=(final+' '+inter).trim() };
  VOZ.onnomatch=()=>{ fallo='No entendí lo que dijiste. Intenta de nuevo, más despacio.' };
  VOZ.onerror=e=>{ fallo={'not-allowed':'Chrome no tiene permiso para el micrófono. Actívalo en Ajustes del teléfono → Aplicaciones → Chrome → Permisos → Micrófono, y en Chrome → Configuración → Configuración de sitios → Micrófono.',
      'service-not-allowed':'El servicio de voz de Google no está disponible en este teléfono. Revisa que la app "Google" esté instalada y activada.',
      'network':'No hay conexión con el servicio de voz de Google.','no-speech':'No escuché nada. Toca el micrófono y habla enseguida.',
      'audio-capture':'No encontré el micrófono o lo está usando otra app.','language-not-supported':'El idioma español (México) no está disponible para dictar.'}[e.error]||('No se pudo dictar (código: '+e.error+')') };
  VOZ.onend=()=>{ clearTimeout(VOZ_T); VOZ=null; const t=final.trim();
    if(!t){ estado(fallo||'No escuché nada. Intenta de nuevo.',true); veil.classList.add('error'); $('#vozCancel').textContent='Cerrar'; return }
    veil.classList.remove('on');
    const m=interpretarVoz(t), k=m._dicho; delete m._dicho;
    if($('#sheet').classList.contains('on')&&S.form){
      const F=S.form;
      if(k.t&&m.t!==F.t){ F.t=m.t; F.c=m.c; F.s=m.s; F.d='' }
      if(k.m) F.m=m.m; if(k.f) F.f=m.f;
      if(k.c){ F.c=m.c; F.s=m.s } if(k.o||k.c) F.o=m.o; if(k.d) F.d=m.d;
      F._voz=t; dibujarForm(); toast('Revisa y toca Guardar'); return }
    abrirForm(m); S.form._fab=true; S.form._voz=t; dibujarForm(); toast('Revisa y toca Guardar') };
  VOZ_T=setTimeout(()=>{ if(VOZ){ try{VOZ.stop()}catch(e){} } },12000);   // por si se queda esperando
  try{ VOZ.start() }catch(e){ estado('No se pudo iniciar el micrófono ('+(e.message||e)+')',true); $('#vozCancel').textContent='Cerrar' }
}
$('#vozCancel').onclick=()=>{ clearTimeout(VOZ_T); if(VOZ){ VOZ.onend=null; try{VOZ.abort()}catch(e){} VOZ=null } $('#vozVeil').classList.remove('on') };
